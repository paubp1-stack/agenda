<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda</title>
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Quiet grey workspace, ink text, one cobalt accent; categories carry the colour. Layout: sidebar + working area, time grids as the main surface. */
  --bg:#f5f5f3; --surface:#ffffff; --surface-2:#efefec; --line:#e3e2de; --line-2:#ecebe8;
  --ink:#1c1d20; --ink-2:#55585e; --ink-3:#8b8e94;
  --accent:#2b55c9; --accent-soft:#e8edfa; --accent-ink:#ffffff;
  --danger:#c4432e; --danger-soft:#fbebe7; --warn:#b97a14; --ok:#2b8a5d;
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --hh:46px; --gut:52px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131416; --surface:#1a1b1e; --surface-2:#232428; --line:#2d2f33; --line-2:#25272a;
    --ink:#ecedf0; --ink-2:#a8abb1; --ink-3:#72757c;
    --accent:#86a2f2; --accent-soft:#222b44; --accent-ink:#0d1222;
    --danger:#ea7a62; --danger-soft:#3a211c; --warn:#e2a84e; --ok:#5fc292;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1a1b1e; --surface-2:#232428; --line:#2d2f33; --line-2:#25272a;
  --ink:#ecedf0; --ink-2:#a8abb1; --ink-3:#72757c;
  --accent:#86a2f2; --accent-soft:#222b44; --accent-ink:#0d1222;
  --danger:#ea7a62; --danger-soft:#3a211c; --warn:#e2a84e; --ok:#5fc292;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
.i{width:18px;height:18px;flex:none}
.hide{display:none!important}
.mono,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px;gap:4px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.02em}
.brand b{font-weight:600;font-size:15px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--surface-2);color:var(--ink)}
.nav a.on .i{color:var(--accent)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.side-create{display:flex;align-items:center;gap:8px;justify-content:center;background:var(--ink);color:var(--surface);border-radius:8px;padding:9px 12px;font-weight:600;margin-bottom:12px}
.side-create:hover{opacity:.9}
.side-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.sync-dot.ok{background:var(--ok)} .sync-dot.busy{background:var(--warn)} .sync-dot.err{background:var(--danger)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink-3)}

.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);min-height:58px}
.top h2{font-size:17px}
.top .sp{flex:1}
.search-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;color:var(--ink-3);min-width:220px}
.search-btn:hover{border-color:var(--ink-3)}
.top-icons{display:none;gap:4px}
.view{flex:1;overflow:auto;padding:24px 28px 40px;min-height:0}
.view.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}

.tabbar{display:none}
.fab{display:none}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:7px 12px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn-s{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:500;white-space:nowrap}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:6px;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.chip.off{opacity:.45}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3));display:inline-block;flex:none}
input[type=text],input[type=url],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical}

/* ---------- headings ---------- */
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin:0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h h3{font-size:14px}
.sec-h .n{color:var(--ink-3);font-size:12.5px}
.sec-h .sp{flex:1}
.muted{color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:13px;padding:10px 0}

/* ---------- dashboard ---------- */
.hello{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.hello h1{font-size:34px;letter-spacing:-.025em;line-height:1.1;margin-top:6px}
.hello .lede{color:var(--ink-2);margin:8px 0 0;font-size:15px}
.hello .sp{flex:1}
.stats-inline{display:flex;gap:28px}
.stat-i b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat-i span{font-size:12px;color:var(--ink-3)}
.stat-i.bad b{color:var(--danger)}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.panel.plain{background:transparent;border:0;padding:0}
.daybar{position:relative;height:44px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 1px,transparent 1px calc(100%/var(--n)));background-color:var(--bg);overflow:hidden;margin-top:4px}
.daybar .blk{position:absolute;top:6px;bottom:6px;border-radius:4px;background:color-mix(in srgb,var(--c) 32%,var(--surface));border-left:3px solid var(--c)}
.daybar .now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger)}
.daybar-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:6px;font-family:var(--mono)}
.nowcard{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:16px}
.nowcard>div{background:var(--surface);padding:12px 14px}
.nowcard .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.nowcard .tt{font-weight:600;margin-top:4px;display:flex;align-items:center;gap:7px}
.nowcard .mt{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{width:86px;height:86px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--surface-2)} .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .4s}
.ring-n{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.agenda-list{display:flex;flex-direction:column}
.al-row{display:grid;grid-template-columns:74px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line-2);align-items:start;cursor:pointer}
.al-row:first-child{border-top:0}
.al-row:hover .al-t{color:var(--accent)}
.al-when{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.35}
.al-when b{display:block;color:var(--ink);font-weight:500;font-size:13px}
.al-t{font-weight:500;display:flex;align-items:center;gap:7px}
.al-m{font-size:12.5px;color:var(--ink-3)}
.rem-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
.rem-row:first-child{border-top:0}
.rem-row .i{color:var(--ink-3)}
.rem-row .r-t{font-weight:500}
.rem-row .r-m{font-size:12px;color:var(--ink-3)}
.rem-row .r-in{margin-left:auto;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.alert-strip{display:flex;gap:10px;align-items:center;background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-weight:500;font-size:13px}

/* ---------- tasks ---------- */
.quick{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 6px 4px 12px}
.quick:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.quick input{border:0;box-shadow:none!important;padding:8px 0;background:transparent}
.quick .hint{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.quick .i{color:var(--ink-3)}
.tlist{display:flex;flex-direction:column}
.trow{display:flex;align-items:flex-start;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line-2);cursor:pointer;border-radius:6px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.trow:hover{background:var(--surface-2)}
.trow[data-dragtask]{cursor:grab}
.chk{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--ink-3);flex:none;margin-top:1px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.trow.p-urgent .chk{border-color:var(--danger)}
.trow.p-high .chk{border-color:var(--warn)}
.chk:hover{background:var(--surface-2)}
.trow.is-done .chk{background:var(--ok);border-color:var(--ok)}
.trow.is-done .chk::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.trow.is-done .tt{text-decoration:line-through;color:var(--ink-3)}
.tbody{flex:1;min-width:0}
.tt{font-weight:500;overflow-wrap:anywhere}
.tm{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-size:12px;color:var(--ink-3)}
.tm .m{display:inline-flex;align-items:center;gap:5px}
.tm .m .i{width:13px;height:13px}
.tm .m-over{color:var(--danger);font-weight:500}
.prio{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;margin-top:1px}
.prio-urgent{background:var(--danger-soft);color:var(--danger)}
.prio-high{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.prio-med{background:var(--surface-2);color:var(--ink-2)}
.prio-low{color:var(--ink-3)}
.tasks-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:880px}
.task-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.task-tabs button{padding:9px 12px;color:var(--ink-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.task-tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.task-tabs .cnt{font-size:11.5px;color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters select{width:auto;padding:4px 8px;font-size:12.5px}
.group-h{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--ink-3);margin:20px 0 4px;display:flex;gap:8px}
.group-h.bad{color:var(--danger)}

/* ---------- time grid ---------- */
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.toolbar .lbl{font-weight:600;font-size:15px;min-width:180px}
.toolbar .sp{flex:1}
.cal-wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 270px;min-height:0}
.cal-main{min-width:0;min-height:0;display:flex;flex-direction:column}
.cal-side{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px}
.cal-side .sec-h{margin-bottom:6px}
.tg{flex:1;min-height:0;display:flex;flex-direction:column}
.tg-scroll{flex:1;overflow:auto;min-height:0;position:relative}
.tg-inner{min-width:calc(var(--gut) + var(--cols) * var(--colmin,0px))}
.tg-head{display:grid;grid-template-columns:var(--gut) 1fr;position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tg-head .hc{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.tg-dh{padding:8px 8px 9px;font-size:12px;color:var(--ink-3);border-left:1px solid var(--line-2);display:flex;align-items:baseline;gap:6px;cursor:default}
.tg-dh b{font-size:17px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tg-dh.today b{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px}
.tg-dh{flex-wrap:wrap;row-gap:0}
.tg-dh .free-sum{flex-basis:100%;font-size:11px;color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-dh[data-goto]{cursor:pointer}
.tg-body{display:grid;grid-template-columns:var(--gut) 1fr}
.tg-hours{position:sticky;left:0;z-index:4;background:var(--bg)}
.tg-hours div{height:var(--hh);position:relative}
.tg-hours span{position:absolute;top:-7px;right:8px;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.tg-hours div:first-child span{display:none}
.tg-cols{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));position:relative;
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh)),repeating-linear-gradient(to bottom,transparent 0 calc(var(--hh)/2),var(--line-2) calc(var(--hh)/2) calc(var(--hh)/2 + 1px),transparent calc(var(--hh)/2 + 1px) var(--hh));background-color:var(--surface)}
.tg-col{position:relative;border-left:1px solid var(--line-2);min-height:100%}
.tg-col.is-today{background:color-mix(in srgb,var(--accent) 3%,transparent)}
.tg-col.drop-on{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.ev{position:absolute;border-radius:5px;padding:3px 7px 3px 8px;overflow:hidden;cursor:pointer;z-index:2;
  background:color-mix(in srgb,var(--c) 17%,var(--surface));border-left:3px solid var(--c);color:color-mix(in srgb,var(--c) 42%,var(--ink));
  font-size:12px;line-height:1.3;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.ev:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ev-sch{background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.ev-task{background:var(--surface);border:1px dashed color-mix(in srgb,var(--c) 60%,transparent);border-left:3px solid var(--c)}
.ev-task.is-done{opacity:.5}
.ev-task.is-done .ev-t{text-decoration:line-through}
.ev.is-mod::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--c)}
.ev-t{font-weight:600;display:flex;gap:5px;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev:not(.is-short) .ev-t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev-t .i{width:12px;height:12px;flex:none}
.ev-m{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.is-short{padding-top:1px;padding-bottom:1px}
.ev.is-short .ev-t{font-size:11.5px}
.ev-rs{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.ev.dragging{opacity:.9;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:10;pointer-events:none;transition:none}
.ev.preview{background:var(--accent-soft);border:1.5px dashed var(--accent);color:var(--accent);pointer-events:none;z-index:9}
.free{position:absolute;left:3px;right:3px;border-radius:5px;border:1px dashed color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 5%,transparent);z-index:1;font-size:11px;color:var(--ok);padding:3px 7px;overflow:hidden;cursor:copy}
.free span{white-space:nowrap}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;background:var(--surface);border:1px solid var(--accent);border-radius:7px;padding:6px 10px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translate(-50%,-120%)}
body.is-dragging{cursor:grabbing;user-select:none}

/* month */
.month{flex:1;display:grid;grid-template-rows:auto 1fr;min-height:0;overflow:auto}
.m-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.m-head div{padding:8px 10px;font-size:12px;color:var(--ink-3);font-weight:500}
.m-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(112px,1fr);background:var(--line);gap:1px}
.m-cell{background:var(--surface);padding:6px 7px;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.m-cell:hover{background:color-mix(in srgb,var(--accent) 3%,var(--surface))}
.m-cell.out{background:var(--bg)}
.m-cell.out .m-d{color:var(--ink-3)}
.m-d{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.m-cell.today .m-d span{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 5px}
.m-dots{display:flex;gap:2px;flex-wrap:wrap}
.m-dots i{width:10px;height:3px;border-radius:2px;background:var(--c)}
.m-chip{font-size:11.5px;display:flex;gap:5px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-radius:4px;padding:1px 4px;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 40%,var(--ink))}
.m-chip time{font-variant-numeric:tabular-nums;opacity:.75}
.m-more{font-size:11px;color:var(--ink-3)}

/* horari */
.hor-free{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);font-size:12.5px}
.hor-free b{font-weight:600;font-variant-numeric:tabular-nums}
.exc-list .rem-row{font-size:13px}

/* planner */
.plan-wrap{flex:1;display:grid;grid-template-columns:330px minmax(0,1fr);min-height:0}
.plan-side{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px 16px 30px}
.plan-sum{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);border-radius:8px;margin-bottom:16px;overflow:hidden}
.plan-sum div{padding:10px 12px;border-left:1px solid var(--line)}
.plan-sum div:first-child{border-left:0}
.plan-sum b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.plan-sum span{font-size:11.5px;color:var(--ink-3)}
.plan-side .trow{padding:9px 4px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:20px}
.kpi{padding:16px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi b{display:block;font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12px;color:var(--ink-3)}
.kpi .delta{font-size:12px;margin-left:6px;font-weight:500}
.delta.up{color:var(--ok)} .delta.down{color:var(--danger)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:170px;padding-top:10px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:44px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bar.zero i{background:var(--line)}
.bar small{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bars-x{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:6px}
.hbar{display:grid;grid-template-columns:120px 1fr 56px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hbar .tr{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--c);border-radius:4px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.hbar .nm{display:flex;gap:7px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* settings */
.set{max-width:760px;display:flex;flex-direction:column;gap:30px}
.set section{display:grid;grid-template-columns:200px 1fr;gap:20px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.set section:last-child{border-bottom:0}
.set h3{font-size:14px}
.set .desc{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.cat-ed{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;margin-bottom:6px}
.cat-ed input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--surface);cursor:pointer}
.status{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:13px}
.prose{font-size:13px;color:var(--ink-2);line-height:1.55}
.prose p{margin:0 0 8px}
.prose b{color:var(--ink);font-weight:600}

/* ---------- modal ---------- */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:block}
.mb{position:absolute;inset:0;background:rgba(15,16,20,.32)}
.md{position:absolute;left:50%;top:7vh;transform:translateX(-50%);width:min(560px,calc(100% - 24px));max-height:86vh;overflow:auto;background:var(--surface);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.25);border:1px solid var(--line)}
.md-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0 20px}
.md-h h2{font-size:15px;flex:1}
.md-in{padding:12px 20px 18px}
.seg-type{margin:0 20px}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.ed .full,.ed-title,.ed-foot{grid-column:1/-1}
.ed-title{font-size:19px!important;font-weight:600;border:0!important;padding:4px 0!important;box-shadow:none!important;background:transparent!important}
.row3{grid-column:1/-1;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--ink-3);font-weight:500}
.ed-foot{display:flex;gap:8px;align-items:center;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:14px}
.ed-foot .sp{flex:1}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.cp input,.dayp input,.prp input{position:absolute;opacity:0;pointer-events:none}
.cp span,.dayp span,.prp span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.cp input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink)}
.cp .dot{background:var(--c)}
.dayp,.prp{display:flex;gap:6px;flex-wrap:wrap}
.dayp span{width:38px;justify-content:center;padding:5px 0;border-radius:7px}
.dayp input:checked+span,.prp input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.prp input[value=urgent]:checked+span{background:var(--danger);border-color:var(--danger);color:#fff}
.prp input[value=high]:checked+span{background:var(--warn);border-color:var(--warn);color:#fff}
.cp input:focus-visible+span,.dayp input:focus-visible+span,.prp input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.remrow{display:flex;gap:6px}
.remrow input{width:80px;flex:none}
.subs{display:flex;flex-direction:column;gap:2px}
.sub{display:flex;align-items:center;gap:8px;padding:3px 0}
.sub input[type=checkbox]{width:16px;height:16px;accent-color:var(--ok)}
.sub .st{flex:1;font-size:13.5px}
.sub.done .st{text-decoration:line-through;color:var(--ink-3)}
.sub .icon-btn{width:24px;height:24px}
.slot-info{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--ink)}
.slot-info .sp{flex:1}
.scope{display:flex;gap:8px;flex-wrap:wrap}
.scope label{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;font-size:13px}
.scope label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.scope input{margin-top:2px;accent-color:var(--accent)}
.note-box{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:7px;padding:8px 10px}

/* search */
.srch{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.srch input{border:0!important;box-shadow:none!important;font-size:16px;padding:4px 0}
.srch-res{max-height:60vh;overflow:auto;padding:6px 8px 10px}
.sr{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer}
.sr:hover,.sr.on{background:var(--surface-2)}
.sr .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;width:78px;flex:none}
.sr .t{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .w{font-size:12px;color:var(--ink-3);white-space:nowrap}

/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--surface);border-radius:9px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;max-width:360px;animation:tin .2s ease-out}
.toast.rem{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--accent);align-items:flex-start}
.toast.rem.over{border-left-color:var(--danger)}
.toast .tb{flex:1}
.toast .tb b{display:block;margin-bottom:2px}
.toast button{color:inherit;opacity:.7;font-weight:600;font-size:12.5px}
.toast button:hover{opacity:1}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width: 1100px){
  .cal-wrap{grid-template-columns:minmax(0,1fr)}
  .cal-side{display:none}
  .dash{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{display:none}
  .top{padding:12px 16px}
  .search-btn{min-width:0;padding:7px}
  .search-btn .lbl,.search-btn .kbd{display:none}
  .top-icons{display:flex}
  .view{padding:18px 16px 96px}
  .view.flush{padding-bottom:0}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10.5px;color:var(--ink-3);text-decoration:none;font-weight:500}
  .tabbar a.on{color:var(--accent)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50}
  .fab .i{width:22px;height:22px}
  .toolbar{padding:10px 12px;gap:8px}
  .toolbar .lbl{min-width:0;font-size:14px;order:-1;width:100%}
  .plan-wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  .plan-side{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .two{grid-template-columns:1fr}
  .set section{grid-template-columns:1fr;gap:10px}
  .hello h1{font-size:28px}
  .stats-inline{gap:20px}
  .m-grid{grid-auto-rows:minmax(74px,1fr)}
  .m-chip{display:none}
  .m-cell .m-sum{display:block}
  .tg{--colmin:96px}
  .md{top:auto;bottom:0;transform:translateX(-50%);border-radius:14px 14px 0 0;max-height:92vh;width:100%}
  #toasts{left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));align-items:stretch}
  .toast{max-width:none}
}

/* auth */
#auth{position:fixed;inset:0;z-index:400;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.auth-card{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.auth-card .brand{padding:0 0 8px}
.auth-card h1{font-size:26px;letter-spacing:-.02em;margin-bottom:4px}
.auth-card .btn.primary{justify-content:center;padding:10px 12px;font-weight:600}
.auth-card .btn:disabled{opacity:.6}
.auth-msg{margin:0;font-size:13px;color:var(--danger);min-height:0}
.auth-msg:empty{display:none}
.auth-msg.ok{color:var(--ink-2);background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.auth-links{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:4px}
.auth-links button{color:var(--accent);font-size:13px;font-weight:500}
/* installed app safe areas */
.top{padding-top:max(14px,env(safe-area-inset-top))}
.side{padding-top:max(18px,env(safe-area-inset-top))}
@media (max-width:860px){.top{padding-top:max(12px,env(safe-area-inset-top))}}
.m-sum{display:none;font-size:11px;color:var(--ink-3)}
/* external calendars */
.ev-ext{background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.tg-adl{font-size:10.5px;color:var(--ink-3);padding:4px 8px;text-align:right;align-self:center;border-top:1px solid var(--line-2)}
.tg-ad{border-top:1px solid var(--line-2)}
.tg-ad>div{padding:3px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.adchip{display:block;width:100%;text-align:left;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--c) 24%,var(--surface));color:color-mix(in srgb,var(--c) 40%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adchip.lg{font-size:13px;padding:8px 11px;border-radius:9px;margin-bottom:8px}
.m-chip.ad{font-weight:600}
.m-big{display:none}
.feed-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.feed-b{flex:1;min-width:0;display:flex;flex-direction:column}
.feed-b span{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.feed-b .feed-err{color:var(--danger)}
.feed-src{font-style:normal;font-size:11px;font-weight:500;color:var(--ink-3);margin-left:6px}
.ext-notes{white-space:pre-wrap;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;max-height:240px;overflow:auto;margin:0;overflow-wrap:anywhere}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
/* swipeable task rows */
.tswipe{position:relative}
.tsw-bg{position:absolute;inset:0 0 8px;display:none;align-items:center;justify-content:space-between;padding:0 16px;border-radius:12px;font-weight:600;font-size:13px;color:#fff}
.tsw-bg span{display:inline-flex;gap:6px;align-items:center;opacity:0;transition:transform .15s}
.tsw-bg .i{width:16px;height:16px}
.tswipe.sw-r .tsw-bg{display:flex;background:var(--ok)}
.tswipe.sw-r .tsw-bg .l{opacity:1}
.tswipe.sw-l .tsw-bg{display:flex;background:var(--warn)}
.tswipe.sw-l .tsw-bg .r{opacity:1}
.tswipe.sw-go .tsw-bg span{transform:scale(1.12)}
/* week strip */
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;flex:1;min-width:0}
.ws-d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:12px;min-width:0}
.ws-d span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.ws-d b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2}
.ws-d.today b{color:var(--accent)}
.ws-d.sel{background:var(--ink)}
.ws-d.sel span,.ws-d.sel b{color:var(--surface)}
.ws-dots{display:flex;gap:2px;height:5px;align-items:center}
.ws-dots em{width:5px;height:5px;border-radius:50%;background:var(--c,var(--ink-3))}
.ws-dots em.s{width:8px;border-radius:3px;background:var(--line)}
.ws-dots em.t{background:transparent;border:1.3px solid var(--ink-3);box-sizing:border-box}
.ws-d.sel .ws-dots em.s{background:color-mix(in srgb,var(--surface) 35%,transparent)}
/* mobile dashboard */
.mh{margin:2px 0 16px}
.mh h1{font-size:30px;letter-spacing:-.025em;margin-top:4px;line-height:1.1}
.mh-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mpill{display:inline-flex;gap:5px;align-items:baseline;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2);text-decoration:none}
.mpill b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.mpill.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.mpill.bad b{color:var(--danger)}
.mpill.ok b{color:var(--ok)}
.view>.wstrip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:14px}
.m-focus{display:flex;flex-direction:column;gap:3px;padding:16px 18px;border-radius:18px;background:color-mix(in srgb,var(--c) 86%,#000);color:#fff;margin-bottom:14px;cursor:pointer}
.m-focus .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.85}
.m-focus b{font-size:20px;letter-spacing:-.01em;line-height:1.2;font-weight:600}
.m-focus .mt{font-size:13.5px;opacity:.92}
.m-focus .mt2{font-size:12.5px;opacity:.85;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.25)}
.m-sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.tl{display:flex;flex-direction:column;gap:8px}
.tl-row{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;cursor:pointer}
.tl-time{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;padding-top:9px}
.tl-time b{font-size:13.5px;font-weight:600}
.tl-time span{font-size:11.5px;color:var(--ink-3)}
.tl-card{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--c) 15%,var(--surface));border-left:4px solid var(--c);min-width:0}
.tl-t{font-weight:600;display:flex;gap:6px;align-items:center;color:color-mix(in srgb,var(--c) 35%,var(--ink));overflow-wrap:anywhere}
.tl-t .i{width:14px;height:14px}
.tl-m{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.tl-row.past{opacity:.5}
.tl-row.is-now .tl-card{background:color-mix(in srgb,var(--c) 24%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
.tl-prog{height:4px;border-radius:2px;background:color-mix(in srgb,var(--c) 25%,transparent);margin-top:8px;overflow:hidden}
.tl-prog i{display:block;height:100%;background:var(--c)}
.tl-gap{margin-left:56px;font-size:12px;color:var(--ok);padding:3px 10px;border-left:2px dashed color-mix(in srgb,var(--ok) 45%,transparent);display:flex;gap:8px;align-items:center}
.tl-now{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center}
.tl-now span{font-size:11.5px;font-weight:700;color:var(--danger);font-variant-numeric:tabular-nums}
.tl-now i{height:2px;background:var(--danger);border-radius:1px;position:relative}
.tl-now i::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.tl-nowdot{width:8px;height:8px;border-radius:50%;background:var(--danger)}
.mring{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mring svg{width:26px;height:26px;transform:rotate(-90deg)}
.mring .bg{stroke:var(--surface-2)}
.mring .fg{stroke:var(--ok)}
.swipe-hint{font-size:11.5px;text-align:center;margin:8px 0 0}
.m-tb{flex-direction:column;align-items:stretch;gap:10px}
.m-row{display:flex;align-items:center;gap:6px}
@media (max-width: 860px){
  :root{--hh:54px}
  .top h2{font-size:21px}
  .tabbar a.on .i{background:var(--accent-soft);border-radius:999px;padding:3px 16px;box-sizing:content-box}
  .tabbar a .i{padding:3px 16px;box-sizing:content-box}
  .fab{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 40%,transparent)}
  .panel{border-radius:16px}
  .trow{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px;margin-bottom:8px;gap:12px}
  .trow:hover{background:var(--surface)}
  .m-sec .trow{background:var(--bg)}
  .chk{width:22px;height:22px}

<script>
"use strict";
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const wd=s=>(pd(s).getDay()+6)%7;
const today=()=>ds(new Date());
const weekStart=s=>addDays(s,-wd(s));
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+(m||0)};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const tsOf=(date,min)=>{const d=pd(date);d.setMinutes(min);return d.getTime()};
const snap15=m=>Math.round(m/15)*15;
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const DAYS=['Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte','Diumenge'];
const DAYS_S=['Dl','Dt','Dc','Dj','Dv','Ds','Dg'];
const MONTHS=['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const MONTHS_S=['gen','febr','març','abr','maig','juny','jul','ag','set','oct','nov','des'];
const deMonth=m=>/^[aeiou]/.test(MONTHS[m])?`d'${MONTHS[m]}`:`de ${MONTHS[m]}`;
const fmtLong=s=>{const d=pd(s);return `${DAYS[wd(s)]} ${d.getDate()} ${deMonth(d.getMonth())}`};
const fmtShort=s=>{const d=pd(s);return `${DAYS_S[wd(s)]} ${d.getDate()} ${MONTHS_S[d.getMonth()]}`};
const fmtRel=s=>{const t=today();if(s===t)return 'Avui';if(s===addDays(t,1))return 'Demà';if(s===addDays(t,-1))return 'Ahir';return fmtShort(s)};
const relAgo=iso=>{const m=Math.round((Date.now()-new Date(iso).getTime())/60000);if(m<1)return 'ara mateix';if(m<60)return `fa ${m} min`;const h=Math.round(m/60);if(h<24)return `fa ${h} h`;return `fa ${Math.round(h/24)} dies`};
const durTxt=m=>{const h=Math.floor(m/60),r=m%60;return h?(r?`${h} h ${r} min`:`${h} h`):`${r} min`};
const inTxt=ms=>{const m=Math.round(ms/60000);if(m<1)return 'ara';if(m<60)return `d'aquí a ${m} min`;const h=Math.floor(m/60);if(h<24)return `d'aquí a ${h} h${m%60?' '+(m%60)+' min':''}`;return `d'aquí a ${Math.round(h/24)} dies`};
const safeColor=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#8b8e94';
const PRIO={urgent:'Urgent',high:'Alta',med:'Mitjana',low:'Baixa'};
const PRIO_RANK={urgent:0,high:1,med:2,low:3};
const REC={daily:'Cada dia',weekdays:'Dies laborables',weekly:'Cada setmana',monthly:'Cada mes'};

/* ================= icons ================= */
const ic=p=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  home:ic('<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>'),
  cal:ic('<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  grid:ic('<rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9h17M9 9v11M15 9v11"/>'),
  check:ic('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 5-5.5"/>'),
  plan:ic('<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>'),
  chart:ic('<path d="M5 20V11M12 20V5M19 20v-6"/>'),
  gear:ic('<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>'),
  plus:ic('<path d="M12 5v14M5 12h14"/>'),
  search:ic('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>'),
  bell:ic('<path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>'),
  left:ic('<path d="M15 5l-7 7 7 7"/>'),
  right:ic('<path d="M9 5l7 7-7 7"/>'),
  x:ic('<path d="M6 6l12 12M18 6L6 18"/>'),
  trash:ic('<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>'),
  repeat:ic('<path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/>'),
  pin:ic('<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>'),
  alert:ic('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>'),
  down:ic('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  sub:ic('<path d="M6 4v9a3 3 0 0 0 3 3h9M14 12l4 4-4 4"/>'),
  tick:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  place:ic('<path d="M4 12h12M12 7l5 5-5 5M20 5v14"/>'),
  filter:ic('<path d="M4 6h16M7 12h10M10 18h4"/>'),
  link:ic('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
  sync:ic('<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/>'),
};

/* ================= store ================= */
const KINDS=['cat','sch','evt','task','cfg'];
const S={cat:{},sch:{},evt:{},task:{},cfg:{}};
let pending={}, meta={lastSync:''}, syncState='connecting', synced=false;
let LS='agenda-v1';
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o){for(const k of KINDS)S[k]=(o.S&&o.S[k])||{};pending=o.p||{};meta=o.m||meta}}catch(e){}}
let saveT;function saveLocal(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify({S,p:pending,m:meta}))}catch(e){}},120)}
function put(kind,obj){obj.u=Date.now();S[kind][obj.id]=obj;mark(kind,obj.id)}
function del(kind,id){delete S[kind][id];mark(kind,id)}
function mark(kind,id){pending[kind+'-'+id]=Date.now()+Math.random();saveLocal();flushSoon();scheduleRender();renderSync();remindersSoon()}
const cat=id=>{const c=S.cat[id]||S.cat.altres||{id:'altres',name:'Sense categoria',color:'#8b8e94'};return {...c,color:safeColor(c.color)}};
const catsSorted=()=>Object.values(S.cat).sort((a,b)=>(a.order??99)-(b.order??99)||String(a.name).localeCompare(b.name));
const cfg=()=>({name:'',dayStart:7,dayEnd:24,...(S.cfg.main||{})});
const defaultCat=()=>S.cat.personal?'personal':(catsSorted()[0]?.id||'altres');

const DEFAULT_CATS=[['estudis','Estudis','#3f7fc4'],['feina','Feina','#c08431'],['personal','Personal','#8a6bc9'],['esport','Esport','#2f9a6b'],['reunions','Reunions','#cf5f4c'],['projectes','Projectes','#33a0a8'],['altres','Altres','#7d8189']];
function ensureDefaults(){
  if(!Object.keys(S.cat).length) DEFAULT_CATS.forEach(([id,name,color],i)=>put('cat',{id,name,color,order:i}));
  if(!S.cfg.main) put('cfg',{id:'main',name:'',dayStart:7,dayEnd:24});
}

/* ================= sync (Supabase) ================= */
const SB_URL='https://aztaijcweclqzkfreurm.supabase.co';
const SB_KEY='sb_publishable_vnqAjT8-kMiwpVk78etnTg_liGAEiRe';
const VAPID_PUB='BKFBz2ZDvnosJq5UHUniU5S7pUKI_u59Um3W4RxkbSS5I4altC1cvKkzKgaOr0nv65MPQkDcvZkkmBnocSD7S54';
let SB=null,USER=null,channel=null;
function applyRow(r){
  const id=r.kind+'-'+r.id;if(!KINDS.includes(r.kind))return false;
  if(pending[id])return false;
  const loc=S[r.kind][r.id];
  if(r.deleted){if(loc&&(r.u||0)>=(loc.u||0)){delete S[r.kind][r.id];return true}return false}
  if(!loc||(r.u||0)>=(loc.u||0)){const d=clone(r.data||{});d.id=r.id;d.u=r.u||0;S[r.kind][r.id]=d;return true}
  return false;
}
async function pull(){
  if(!SB||!USER)return;
  try{
    let q=SB.from('items').select('kind,id,data,u,deleted,updated_at').order('updated_at',{ascending:true}).limit(5000);
    if(meta.lastSync)q=q.gt('updated_at',meta.lastSync);
    const {data,error}=await q;if(error)throw error;
    let ch=false;for(const r of data||[]){if(applyRow(r))ch=true;if(!meta.lastSync||r.updated_at>meta.lastSync)meta.lastSync=r.updated_at}
    if(!synced){synced=true;ensureDefaults();ch=true}
    if(syncState!=='error')syncState='ok';
    saveLocal();if(ch)scheduleRender();renderSync();remindersSoon();
  }catch(e){syncState=navigator.onLine?'error':'slow';renderSync()}
}
function subscribeLive(){
  if(channel)SB.removeChannel(channel);
  channel=SB.channel('items-'+USER.id).on('postgres_changes',{event:'*',schema:'public',table:'items',filter:'user_id=eq.'+USER.id},p=>{
    const r=p.new&&p.new.kind?p.new:null;if(!r)return;
    if(applyRow(r)){saveLocal();scheduleRender();remindersSoon()}
    if(r.updated_at&&(!meta.lastSync||r.updated_at>meta.lastSync))meta.lastSync=r.updated_at;
  }).on('postgres_changes',{event:'*',schema:'public',table:'feeds',filter:'user_id=eq.'+USER.id},()=>pullExtSoon()).subscribe(s=>{if(s==='SUBSCRIBED')pull()});
}
let flushT,flushing=false;
function flushSoon(){if(!SB||!USER)return;clearTimeout(flushT);flushT=setTimeout(flush,400)}
async function flush(){
  if(!SB||!USER||flushing)return;flushing=true;let ok=true;
  try{
    while(true){
      const ids=Object.keys(pending);if(!ids.length)break;
      const batch=ids.slice(0,200),vers={};
      const rows=batch.map(id=>{vers[id]=pending[id];const i=id.indexOf('-'),kind=id.slice(0,i),iid=id.slice(i+1),it=S[kind]&&S[kind][iid];
        return it?{user_id:USER.id,kind,id:iid,data:clone(it),u:it.u||Date.now(),deleted:false}:{user_id:USER.id,kind,id:iid,data:{},u:Date.now(),deleted:true}});
      const {error}=await SB.from('items').upsert(rows,{onConflict:'user_id,kind,id'});
      if(error){ok=false;syncState=navigator.onLine?'error':'slow';break}
      batch.forEach(id=>{if(pending[id]===vers[id])delete pending[id]});
      if(syncState==='error'||syncState==='slow')syncState='ok';saveLocal();
    }
  }catch(e){ok=false;syncState='slow'}
  finally{flushing=false;renderSync();if(ok&&Object.keys(pending).length)flushSoon();else if(!ok)setTimeout(flushSoon,15000)}
}
function renderSync(){
  const n=Object.keys(pending).length;
  const map={local:['','Sense sessió'],connecting:['busy','Connectant…'],slow:['busy','Sense connexió · es desa aquí'],ok:n?['busy','Desant…']:['ok','Sincronitzat'],error:['err','Error en desar'] };
  const [cls,txt]=map[syncState]||map.local;
  const d=$('#sync-dot'),t=$('#sync-txt');if(d){d.className='sync-dot '+cls;t.textContent=txt}
}
/* server-side reminders: the app computes them, Supabase sends them as push */
let remT;function remindersSoon(){clearTimeout(remT);remT=setTimeout(pushReminders,3000)}
async function pushReminders(){
  if(!SB||!USER||!synced)return;
  const now=Date.now(),list=remindersBetween(now-5*60000,now+21*86400000).filter(r=>r.at>now-5*60000).slice(0,400).map(r=>{
    const mins=Math.round((r.st-r.at)/60000);
    if(r.allDay)return {k:r.k,at:r.at,title:r.title,body:`${fmtRel(r.date)} · tot el dia`};
    return {k:r.k,at:r.at,title:r.title,body:mins>0?`${fmtRel(r.date)} a les ${fromMin(r.start)} · d'aquí a ${mins>=60&&mins%60===0?mins/60+' h':mins+' min'}`:`Comença ara (${fromMin(r.start)})`}});
  for(const t of tasksAll()){if(t.done||!t.due)continue;const ts=taskDueTs(t);if(ts>now&&ts<now+21*86400000)list.push({k:`over:${t.id}:${t.due}${t.time||''}`,at:ts+60000,title:'Tasca vençuda',body:t.title})}
  try{await SB.rpc('sync_reminders',{rems:list})}catch(e){}
}

/* ================= external calendars ================= */
let FEEDS={},EXT=[];
const LSX=()=>LS+'-ext';
function loadExtLocal(){FEEDS={};EXT=[];try{const o=JSON.parse(localStorage.getItem(LSX())||'null');if(o){FEEDS=o.f||{};EXT=o.e||[]}}catch(e){}}
function saveExtLocal(){try{localStorage.setItem(LSX(),JSON.stringify({f:FEEDS,e:EXT}))}catch(e){}}
async function pullExt(){
  if(!SB||!USER)return;
  try{
    const {data:f,error:e1}=await SB.from('feeds').select('id,name,url,cat,reminder,enabled,last_sync,last_error,event_count,created_at,source').order('created_at');if(e1)throw e1;
    const {data:x,error:e2}=await SB.from('ext_events').select('feed_id,uid,date,end_date,all_day,start_min,end_min,title,location,notes').gte('end_date',addDays(today(),-40)).lte('date',addDays(today(),200)).order('date').limit(5000);if(e2)throw e2;
    FEEDS={};(f||[]).forEach(r=>FEEDS[r.id]=r);EXT=x||[];saveExtLocal();scheduleRender();remindersSoon();
  }catch(e){}
}
let extT;function pullExtSoon(){clearTimeout(extT);extT=setTimeout(pullExt,800)}
const feedOf=e=>FEEDS[e.feed_id];
const extOk=e=>{const f=feedOf(e);return !!(f&&f.enabled)};
const extKey=e=>`ext:${e.feed_id}:${e.uid}`;
function extAllDay(from,to){return EXT.filter(e=>e.all_day&&extOk(e)&&e.date<=to&&e.end_date>=from).map(e=>({key:extKey(e),type:'ext',allDay:true,id:e.uid,feed:e.feed_id,date:e.date,end_date:e.end_date,title:e.title,cat:feedOf(e).cat,location:e.location,notes:e.notes}))}
function adOn(list,d){return list.filter(a=>a.date<=d&&a.end_date>=d)}
async function syncFeedNow(id,quiet){
  if(!SB)return;
  if(!quiet)toast('Actualitzant el calendari…');
  try{const {data,error}=await SB.functions.invoke('sync-feeds',{body:id?{feed_id:id}:{}});if(error)throw error;
    await pullExt();const r=(data&&data.results)||[];
    if(!quiet){const bad=r.find(x=>!x.ok);toast(bad?`No s\u2019ha pogut llegir: ${bad.error}`:`Calendari actualitzat · ${r.reduce((a,x)=>a+(x.events||0),0)} esdeveniments.`)}
  }catch(e){if(!quiet)toast('No s\u2019ha pogut connectar amb el servidor. Torna-ho a provar.')}
  if(st.route==='ajustos')render();
}

/* ================= domain ================= */
function occs(from,to){
  const out=[];
  const schs=Object.values(S.sch);
  for(let d=from;d<=to;d=addDays(d,1)){
    const w=wd(d);
    for(const s of schs){
      if(s.day!==w)continue;
      if(s.from&&d<s.from)continue;if(s.until&&d>s.until)continue;
      const ex=s.exc&&s.exc[d];if(ex&&ex.cancel)continue;

    const st=tsOf(t.due,toMin(t.time)),at=st-t.reminder*60000;
    if(st>=fromTs&&at<=toTs)out.push({k:`due:${t.id}@${t.reminder}@${t.due}${t.time}`,at,st,title:t.title,cat:t.cat,rem:t.reminder,date:t.due,start:toMin(t.time),type:'task',id:t.id});

function icsText(){

  const st=new Date();const stamp=`${st.getUTCFullYear()}${pad(st.getUTCMonth()+1)}${pad(st.getUTCDate())}T${pad(st.getUTCHours())}${pad(st.getUTCMinutes())}00Z`;
  const dt=(date,min)=>{min=Math.min(min,1439);return date.replace(/-/g,'')+'T'+pad(Math.floor(min/60))+pad(min%60)+'00'};
  const tx=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const alarm=r=>r==null?[]:['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Recordatori',`TRIGGER:-PT${r}M`,'END:VALARM'];
  const ev=(uidv,date,a,b,sum,loc,desc,rem,extra=[])=>{L.push('BEGIN:VEVENT',`UID:${uidv}@agenda`,`DTSTAMP:${stamp}`,`DTSTART:${dt(date,a)}`,`DTEND:${dt(date,b)}`,`SUMMARY:${tx(sum)}`);if(loc)L.push(`LOCATION:${tx(loc)}`);if(desc)L.push(`DESCRIPTION:${tx(desc)}`);L.push(...extra,...alarm(rem),'END:VEVENT')};
  const BY=['MO','TU','WE','TH','FR','SA','SU'];
  for(const s of Object.values(S.sch)){

    const a=toMin(s.start),b=toMin(s.end);if(a==null||b==null)continue;
    const extra=[`RRULE:FREQ=WEEKLY;BYDAY=${BY[s.day]}${s.until?';UNTIL='+s.until.replace(/-/g,'')+'T235959':''}`];
    const exc=s.exc||{};
    Object.keys(exc).forEach(d=>extra.push(`EXDATE:${dt(d,a)}`));
    ev('sch-'+s.id,first,a,b,s.title,s.location,s.notes,s.reminder,extra);
    Object.entries(exc).forEach(([d,x])=>{if(x.cancel)return;const o={...s,...x};ev(`sch-${s.id}-${d}`,d,toMin(o.start),toMin(o.end),o.title,o.location,o.notes,s.reminder)});
  }
  for(const e of Object.values(S.evt))ev('evt-'+e.id,e.date,toMin(e.start),toMin(e.end),e.title,e.location,e.notes,e.reminder);
  for(const t of tasksAll()){if(t.done)continue;

  return L.join('\r\n');
}

function timeGrid({dates,items,heads,free,mode,colmin,allDay}){
  const c=cfg(),s0=c.dayStart*60,s1=c.dayEnd*60,H=hh();
  const hours=[];for(let h=c.dayStart;h<c.dayEnd;h++)hours.push(h);
  const by={};items.forEach(o=>(by[o.date]=by[o.date]||[]).push(o));
  const t=today();
  const cols=dates.map(d=>{
    const its=layLanes(by[d]||[]).filter(o=>o.end>s0&&o.start<s1);
    const isT=d===t&&mode!=='sch';
    const fr=(free&&free[d]||[]).map(([a,b])=>`<div class="free" data-free="${a}-${b}" style="top:${(a-s0)/60*H+1}px;height:${(b-a)/60*H-2}px"><span>Lliure ${fromMin(a)}–${fromMin(b)}</span></div>`).join('');
    const nm=nowMin();
    const now=isT&&nm>=s0&&nm<=s1?`<div class="nowline" style="top:${(nm-s0)/60*H}px"></div>`:'';
    return `<div class="tg-col ${isT?'is-today':''}" data-date="${d}" data-mode="${mode}">${fr}${its.map(o=>evBlock(o,s0,s1,H)).join('')}${now}</div>`;
  }).join('');
  return `<div class="tg tg-n${dates.length}" style="--cols:${dates.length};${colmin?`--colmin:${colmin}px;`:''}"><div class="tg-scroll"><div class="tg-inner">
    <div class="tg-head"><div></div><div class="hc">${heads.join('')}</div>${allDay&&allDay.length?`<div class="tg-adl">Dia</div><div class="hc tg-ad">${dates.map(d=>`<div>${adOn(allDay,d).map(a=>`<button class="adchip" style="--c:${cat(a.cat).color}" data-open-occ="${esc(a.key)}">${esc(a.title)}</button>`).join('')}</div>`).join('')}</div>`:''}</div>
    <div class="tg-body"><div class="tg-hours">${hours.map(h=>`<div><span>${pad(h)}:00</span></div>`).join('')}</div>
    <div class="tg-cols" style="height:${(s1-s0)/60*H}px">${cols}</div></div>
  </div></div></div>`;
}
function evBlock(o,s0,s1,H){
  const top=Math.max(0,(o.start-s0)/60*H),bot=(Math.min(o.end,s1)-s0)/60*H;
  const h=Math.max(17,bot-top-2),w=100/(o._cols||1),l=(o._col||0)*w,c=cat(o.cat).color,short=h<36;
  return `<div class="ev ev-${o.type} ${o.done?'is-done':''} ${short?'is-short':''} ${o.modified?'is-mod':''}" style="--c:${c};top:${top+1}px;height:${h}px;left:calc(${l}% + 2px);width:calc(${w}% - 4px)" data-key="${esc(o.key)}" data-type="${o.type}" data-id="${esc(o.id)}" data-date="${o.date}" data-start="${o.start}" data-end="${o.end}" title="${esc(o.title)} · ${fromMin(o.start)}–${fromMin(o.end)}">
    <div class="ev-t">${o.type==='task'?I.check:o.type==='ext'?I.link:''}<span>${esc(o.title)}</span></div>
    ${short?'':`<div class="ev-m">${fromMin(o.start)}–${fromMin(o.end)}${o.location?' · '+esc(o.location):''}</div>`}
    ${o.type==='ext'?'':'<div class="ev-rs" data-resize="1"></div>'}</div>`;
}

/* ---------- calendar ---------- */
function weekStrip(sel){
  const ws=weekStart(sel),we=addDays(ws,6),t=today(),os=occs(ws,we),ad=extAllDay(ws,we);
  return `<div class="wstrip">${Array.from({length:7},(_,i)=>{const d=addDays(ws,i);
    const own=os.filter(o=>o.date===d&&o.type!=='sch'),sch=os.some(o=>o.date===d&&o.type==='sch');
    const dots=[...own.slice(0,3).map(o=>cat(o.cat).color),...adOn(ad,d).slice(0,2).map(x=>cat(x.cat).color)].slice(0,3);
    const due=tasksAll().some(x=>!x.done&&!x.slot&&x.due===d);
    return `<button class="ws-d ${d===sel?'sel':''} ${d===t?'today':''}" data-goto-day="${d}" aria-label="${fmtLong(d)}"><span>${DAYS_S[i]}</span><b>${pd(d).getDate()}</b><i class="ws-dots">${sch?'<em class="s"></em>':''}${dots.map(c=>`<em style="--c:${c}"></em>`).join('')}${due?'<em class="t"></em>':''}</i></button>`}).join('')}</div>`;
}

  const tb=mob?`<div class="toolbar m-tb">
      <div class="m-row"><span class="lbl">${label}</span><span class="sp"></span><button class="icon-btn" data-act="${v==='day'?'cal-prev-w':'cal-prev'}" aria-label="Anterior">${I.left}</button><button class="icon-btn" data-act="${v==='day'?'cal-next-w':'cal-next'}" aria-label="Següent">${I.right}</button><button class="icon-btn ${st.showFilters?'on':''}" data-act="toggle-filters" aria-label="Filtres">${I.filter}</button><button class="btn-s" data-act="cal-today">Avui</button></div>
      ${seg}

   :`<div class="toolbar">${seg}

/* ---------- weekly schedule ---------- */
function vHorari(){
  const ws=weekStart(today());
  const dates=Array.from({length:7},(_,i)=>addDays(ws,i));
  const c=cfg();
  const items=Object.values(S.sch).map(s=>{const a=toMin(s.start),b=toMin(s.end);return {key:`tpl:${s.id}`,type:'sch',id:s.id,date:dates[s.day],start:a,end:b,title:s.title,cat:s.cat,location:s.location}}).filter(o=>o.start!=null&&o.end>o.start);
  const free={};const sums=[];
  dates.forEach((d,i)=>{const busy=items.filter(o=>o.date===d).map(o=>[o.start,o.end]);const fr=freeFrom(busy,c.dayStart*60,c.dayEnd*60,30);free[d]=fr;sums.push(fr.reduce((a,[x,y])=>a+y-x,0))});
  const mob=isMobile();
  const heads=dates.map((d,i)=>mob?`<div class="tg-dh gd"><span>${DAYS_S[i]}</span>${st.showFree?`<em class="fs">${Math.round(sums[i]/60)}h</em>`:''}</div>`:`<div class="tg-dh"><b style="font-size:13.5px">${DAYS[i]}</b>${st.showFree?`<span class="free-sum">${durTxt(sums[i])} lliures</span>`:''}</div>`);
  // upcoming exceptions
  const t=today();const exc=[];
  Object.values(S.sch).forEach(s=>Object.entries(s.exc||{}).forEach(([d,x])=>{if(d>=t)exc.push({s,d,x})}));
  exc.sort((a,b)=>a.d.localeCompare(b.d));
  const busyH=items.reduce((a,o)=>a+(o.end-o.start),0);
  return {title:'Horari setmanal',flush:true,html:`
  <div class="toolbar">
    <span class="lbl">El meu horari habitual</span>
    <span class="muted hide-m" style="font-size:12.5px">${items.length} activitats · ${durTxt(busyH)} ocupades a la setmana</span>
    <span class="sp"></span>
    <button class="chip ${st.showFree?'on':''}" data-act="toggle-free">${mob?'Hores lliures':'Mostra hores lliures'}</button>
    <button class="btn primary" data-act="new-sch">${I.plus} ${mob?'Afegeix':'Afegeix activitat'}</button>
  </div>
  <div class="cal-wrap">
    <div class="cal-main">${timeGrid({dates,items,heads,mode:'sch',free:st.showFree?free:null,colmin:mob?0:110})}</div>
    <aside class="cal-side">
      <div class="sec-h"><h3>Com funciona</h3></div>
      <p class="muted" style="font-size:12.5px;margin:0 0 18px">Aquestes activitats es repeteixen cada setmana i apareixen al calendari. Arrossega-les per canviar-ne l\u2019hora o el dia de tota la sèrie. Per canviar un sol dia, fes-ho des del calendari.</p>
      <div class="sec-h"><h3>Excepcions properes</h3><span class="n">${exc.length}</span></div>
      <div class="exc-list">${exc.slice(0,20).map(({s,d,x})=>`<div class="rem-row"><i class="dot" style="--c:${cat(s.cat).color}"></i><div style="min-width:0"><div class="r-t">${esc(x.title||s.title)}</div><div class="r-m">${fmtShort(d)} · ${x.cancel?'Anul·lada':`${x.start||s.start}–${x.end||s.end}`}</div></div><button class="btn-s" style="margin-left:auto" data-restore="${s.id}|${d}">Restaura</button></div>`).join('')||'<div class="empty">Cap canvi puntual. Si un dia l\u2019horari canvia, obre l\u2019activitat al calendari i tria «Només aquest dia».</div>'}</div>
    </aside>
  </div>`};
}

/* ---------- tasks ---------- */
function taskSets(){
  const t=today(),tm=addDays(t,1),ws=weekStart(t),we=addDays(ws,6),all=tasksAll();
  const on=(x,d)=>x.due===d||(x.slot&&x.slot.date===d);
  return {
    avui:all.filter(x=>!x.done&&(on(x,t)||(x.due&&x.due<t))),
    dema:all.filter(x=>!x.done&&on(x,tm)),
    setmana:all.filter(x=>!x.done&&((x.due&&x.due>=ws&&x.due<=we)||(x.slot&&x.slot.date>=ws&&x.slot.date<=we))),
    pendents:all.filter(x=>!x.done),
    fetes:all.filter(x=>x.done),
  };
}
function vTasks(){
  const sets=taskSets(),tab=st.taskTab;
  const filt=a=>a.filter(x=>(!st.fCat||x.cat===st.fCat)&&(!st.fPrio||x.prio===st.fPrio));
  let list=filt(sets[tab]||[]);
  const tabs=[['avui','Avui'],['dema','Demà'],['setmana','Aquesta setmana'],['pendents','Pendents'],['fetes','Completades']];
  let body='';
  const grp=(h,a,bad)=>a.length?`<div class="group-h ${bad?'bad':''}">${h}<span>${a.length}</span></div><div class="tlist">${a.map(x=>taskRow(x)).join('')}</div>`:'';
  if(tab==='avui'){const ov=sortTasks(list.filter(isOverdue));body=grp('Vençudes',ov,true)+grp('Avui',sortTasks(list.filter(x=>!isOverdue(x))))}
  else if(tab==='setmana'){const ws=weekStart(today());for(let i=0;i<7;i++){const d=addDays(ws,i);body+=grp(fmtLong(d)+(d===today()?' · avui':''),sortTasks(list.filter(x=>(x.slot?x.slot.date:x.due)===d)),false)}}
  else if(tab==='pendents'){body=grp('Vençudes',sortTasks(list.filter(isOverdue)),true)+grp('Amb data',sortTasks(list.filter(x=>x.due&&!isOverdue(x))))+grp('Sense data',sortTasks(list.filter(x=>!x.due)))}
  else if(tab==='fetes'){list.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));const by={};list.forEach(x=>{const d=x.doneAt?ds(new Date(x.doneAt)):'—';(by[d]=by[d]||[]).push(x)});body=Object.entries(by).map(([d,a])=>grp(d==='—'?'Sense data':fmtLong(d),a)).join('')}
  else body=grp('',sortTasks(list));
  if(!body)body=`<div class="empty" style="padding:30px 0">${tab==='fetes'?'Encara no has completat cap tasca.':'No hi ha tasques aquí.'}</div>`;
  const qm={avui:['today','Nova tasca per avui'],dema:['tomorrow','Nova tasca per demà'],setmana:['today','Nova tasca'],pendents:['none','Nova tasca sense data'],fetes:null}[tab];
  return {title:'Tasques',html:`<div class="tasks-layout">
    <div class="task-tabs">${tabs.map(([k,l])=>`<button data-tasktab="${k}" class="${tab===k?'on':''}">${l}<span class="cnt">${(sets[k]||[]).length}</span></button>`).join('')}</div>
    ${qm?quickAdd(qm[0],qm[1]+' i prem Retorn'):''}
    <div class="filters">
      <div class="chips"><button class="chip ${!st.fCat?'on':''}" data-fcat="">Totes</button>${catsSorted().map(c=>`<button class="chip ${st.fCat===c.id?'on':''}" data-fcat="${c.id}" style="--c:${safeColor(c.color)}"><i class="dot"></i>${esc(c.name)}</button>`).join('')}</div>
      <select data-fprio aria-label="Filtra per prioritat"><option value="">Totes les prioritats</option>${Object.entries(PRIO).map(([k,l])=>`<option value="${k}" ${st.fPrio===k?'selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div>${body}</div>
  </div>`};
}

/* ---------- planner ---------- */
function vPlan(){
  const d=st.planDate,c=cfg();
  const items=occs(d,d);
  const fr=freeSlots(d,{fromNow:true});
  const freeMin=fr.reduce((a,[x,y])=>a+y-x,0);
  const pend=sortTasks(tasksAll().filter(t=>!t.done&&!t.slot&&(!t.due||t.due<=addDays(d,7))));
  const later=tasksAll().filter(t=>!t.done&&!t.slot&&t.due&&t.due>addDays(d,7)).length;
  const prio=pend.filter(t=>t.prio==='urgent'||t.prio==='high'||isOverdue(t)||t.due===d);
  const rest=pend.filter(t=>!prio.includes(t));
  const sched=sortTasks(tasksAll().filter(t=>t.slot&&t.slot.date===d));
  const heads=[`<div class="tg-dh ${d===today()?'today':''}">${DAYS[wd(d)]} <b>${pd(d).getDate()}</b><span class="free-sum">${durTxt(freeMin)} lliures</span></div>`];
  return {title:'Planifica el dia',flush:true,html:`
  <div class="toolbar">
    <button class="icon-btn" data-act="plan-prev" aria-label="Dia anterior">${I.left}</button>
    <button class="btn" data-act="plan-today">Avui</button>
    <button class="icon-btn" data-act="plan-next" aria-label="Dia següent">${I.right}</button>
    <span class="lbl">${fmtLong(d)}</span>
    <span class="sp"></span>
    <button class="btn" data-act="auto-plan">${I.place} Col·loca les prioritàries</button>
  </div>
  <div class="plan-wrap">
    <aside class="plan-side">
      <div class="plan-sum"><div><b>${items.filter(o=>o.type!=='task').length}</b><span>Activitats</span></div><div><b>${fr.length}</b><span>Espais lliures</span></div><div><b>${pend.length}</b><span>Per col·locar</span></div></div>
      <p class="muted" style="font-size:12px;margin:0 0 6px">Arrossega una tasca a un espai lliure o prem «Col·loca». Mai es posarà a sobre de l\u2019horari ni dels esdeveniments.</p>
      ${prio.length?`<div class="group-h">Prioritats<span>${prio.length}</span></div><div class="tlist">${prio.map(t=>taskRow(t,{drag:true,place:true})).join('')}</div>`:''}
      ${rest.length?`<div class="group-h">Altres pendents<span>${rest.length}</span></div><div class="tlist">${rest.map(t=>taskRow(t,{drag:true,place:true})).join('')}</div>`:''}
      ${!pend.length?'<div class="empty">No hi ha tasques pendents per col·locar.</div>':''}
      ${later?`<p class="muted" style="font-size:12px">${later} tasques més tenen data a partir de la setmana vinent.</p>`:''}
      ${sched.length?`<div class="group-h">Ja programades aquest dia<span>${sched.length}</span></div><div class="tlist">${sched.map(t=>taskRow(t,{noSlot:false})).join('')}</div>`:''}
    </aside>
    <div class="cal-main">${timeGrid({dates:[d],items,heads,mode:'plan',free:{[d]:fr}})}</div>
  </div>`};
}
function autoPlace(id,date,silent){
  const t=S.task[id];if(!t)return false;
  const dur=t.dur||60,c=cfg();
  let from=c.dayStart*60;if(date===today())from=Math.max(from,Math.ceil(nowMin()/15)*15);
  const start=findFit(date,from,dur,'task:'+id);
  if(start==null||start<from&&date===today()){if(!silent)toast(`No hi ha cap espai lliure de ${durTxt(dur)} aquest dia.`);return false}
  put('task',{...clone(t),slot:{date,start:fromMin(start),end:fromMin(start+dur)}});
  if(!silent)toast(`«${t.title}» col·locada a les ${fromMin(start)}.`);
  return true;
}

/* ---------- stats ---------- */
function vStats(){
  const ws=st.statsWeek,we=addDays(ws,6),pws=addDays(ws,-7),pwe=addDays(ws,-1);
  const dates=Array.from({length:7},(_,i)=>addDays(ws,i));
  const all=tasksAll();
  const doneDay=x=>x.done&&x.doneAt?ds(new Date(x.doneAt)):null;
  const per=dates.map(d=>all.filter(x=>doneDay(x)===d).length);
  const tot=per.reduce((a,b)=>a+b,0);
  const prev=all.filter(x=>{const d=doneDay(x);return d&&d>=pws&&d<=pwe}).length;
  const dueW=all.filter(x=>x.due&&x.due>=ws&&x.due<=we);
  const rate=dueW.length?Math.round(dueW.filter(x=>x.done).length/dueW.length*100):null;
  const os=occs(ws,we);
  const hrs={};os.forEach(o=>{if(o.type==='task'&&!o.done)return;hrs[o.cat]=(hrs[o.cat]||0)+(o.end-o.start)});
  const totH=Object.values(hrs).reduce((a,b)=>a+b,0);
  const byCat={};all.filter(x=>{const d=doneDay(x);return d&&d>=ws&&d<=we}).forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+1);
  const max=Math.max(1,...per);
  const delta=tot-prev;
  const hb=(obj,fmt)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...e.map(x=>x[1]));return e.map(([k,v])=>{const c=cat(k);return `<div class="hbar" style="--c:${c.color}"><span class="nm"><i class="dot"></i>${esc(c.name)}</span><span class="tr"><i style="width:${v/mx*100}%"></i></span><span class="v">${fmt(v)}</span></div>`}).join('')||'<div class="empty">Sense dades aquesta setmana.</div>'};
  const a=pd(ws),b=pd(we);
  return {title:'Estadístiques',html:`
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap">
    <button class="icon-btn" data-act="stats-prev" aria-label="Setmana anterior">${I.left}</button>
    <button class="btn" data-act="stats-now">Aquesta setmana</button>
    <button class="icon-btn" data-act="stats-next" aria-label="Setmana següent">${I.right}</button>
    <h3 style="font-size:15px;margin-left:6px">${a.getDate()} ${MONTHS_S[a.getMonth()]} – ${b.getDate()} ${MONTHS_S[b.getMonth()]} ${b.getFullYear()}</h3>
  </div>
  <div class="kpis">
    <div class="kpi"><b>${tot}${prev||tot?`<span class="delta ${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta}</span>`:''}</b><span>Tasques completades · ${prev} la setmana anterior</span></div>
    <div class="kpi"><b>${rate==null?'—':rate+'%'}</b><span>Compliment de les tasques amb data aquesta setmana (${dueW.filter(x=>x.done).length}/${dueW.length})</span></div>
    <div class="kpi"><b>${Math.round(totH/6)/10} h</b><span>Temps programat al calendari</span></div>
    <div class="kpi"><b>${all.filter(isOverdue).length}</b><span>Tasques vençudes ara mateix</span></div>
  </div>
  <section class="panel" style="margin-bottom:20px">
    <div class="sec-h"><h3>Tasques completades per dia</h3></div>
    <div class="bars">${per.map(n=>`<div class="bar ${n?'':'zero'}"><small>${n}</small><i style="height:${n/max*130}px"></i></div>`).join('')}</div>
    <div class="bars-x">${dates.map(d=>`<span>${DAYS_S[wd(d)]} ${pd(d).getDate()}</span>`).join('')}</div>
  </section>
  <div class="two">
    <section class="panel"><div class="sec-h"><h3>Hores per categoria</h3><span class="n">Horari, esdeveniments i tasques fetes</span></div>${hb(hrs,v=>`${Math.round(v/6)/10} h`)}</section>
    <section class="panel"><div class="sec-h"><h3>Tasques fetes per categoria</h3></div>${hb(byCat,v=>v)}</section>
  </div>
  <p class="muted" style="font-size:12.5px;margin-top:18px">L\u2019historial complet de tasques fetes és a <a href="#tasques" data-act="goto-done">Tasques › Completades</a>.</p>`};
}
