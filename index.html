          <p>Es programen els avisos de les pròximes tres setmanes cada vegada que obres l\u2019app o hi fas canvis. Si passes més de tres setmanes sense obrir-la, deixaran d\u2019arribar fins que la tornis a obrir. També rebràs un avís quan una tasca amb data venci sense haver-la completat.</p>
        </div>
        <button class="btn" data-act="ics" style="margin-top:6px">${I.down} Exporta a calendari (.ics)</button>
      </div></section>
    <section><div><h3>Compte i dades</h3><p class="desc">On es guarda tot.</p></div>
      <div class="prose"><p><span class="status"><span class="sync-dot ${syncState==='ok'?'ok':'busy'}"></span>${syncState==='ok'?'Sincronitzat':'Connectant'} · ${esc(USER&&USER.email||'')}</span></p>
      <p>Les tasques, l\u2019horari, els esdeveniments i les categories es guarden a la teva base de dades de Supabase, i només hi pot accedir el teu usuari. Entra amb el mateix correu des de qualsevol dispositiu i hi veuràs el mateix. També se\u2019n guarda una còpia al dispositiu perquè puguis fer-la servir sense connexió; quan torna la connexió, els canvis es pugen sols.</p>
      <button class="btn" data-act="logout">Tanca la sessió</button></div></section>
  </div>`};
}

/* ================= modals ================= */
const MR=()=>$('#modal-root');
function openModal(html,onMount){
  const r=MR();r.innerHTML=`<div class="mb" data-close></div><div class="md" role="dialog" aria-modal="true">${html}</div>`;
  r.classList.add('open');
  const md=r.querySelector('.md');onMount&&onMount(md);
  const f=md.querySelector('[autofocus]')||md.querySelector('input:not([type=hidden]),textarea');
  if(f&&innerWidth>760){try{f.focus()}catch(e){}}
}
function closeModal(){const r=MR();r.classList.remove('open');r.innerHTML='';if(pendingRender)render()}
const mhead=t=>`<div class="md-h"><h2>${t}</h2><button type="button" class="icon-btn" data-close aria-label="Tanca">${I.x}</button></div>`;
const fld=(l,inner,cls='')=>`<label class="fld ${cls}"><span>${l}</span>${inner}</label>`;
const catPicker=sel=>`<div class="catpick" role="radiogroup">${catsSorted().map(c=>`<label class="cp" style="--c:${safeColor(c.color)}"><input type="radio" name="cat" value="${c.id}" ${c.id===sel?'checked':''}><span><i class="dot"></i>${esc(c.name)}</span></label>`).join('')}</div>`;
function remPicker(v){const std=[5,15,30,60],cu=v!=null&&!std.includes(v);return `<div class="remrow"><select name="rem"><option value="">Sense avís</option>${std.map(m=>`<option value="${m}" ${v===m?'selected':''}>${m===60?'1 hora':m+' minuts'} abans</option>`).join('')}<option value="custom" ${cu?'selected':''}>Personalitzat…</option></select><input type="number" name="remc" min="1" max="20160" value="${cu?v:''}" placeholder="min" class="${cu?'':'hide'}" aria-label="Minuts abans"></div>`}
function readRem(f){const v=f.rem.value;if(!v)return null;if(v==='custom'){const n=parseInt(f.remc.value,10);return n>0?n:null}return +v}
function bindRem(md){const f=md.querySelector('form');if(!f||!f.rem)return;f.rem.addEventListener('change',()=>{f.remc.classList.toggle('hide',f.rem.value!=='custom');if(f.rem.value==='custom')f.remc.focus()})}
function bindDelete(md,fn){const b=md.querySelector('[data-del]');if(!b)return;b.addEventListener('click',()=>{if(!b.classList.contains('armed')){b.classList.add('armed');b.dataset.t=b.textContent;b.textContent='Confirma';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=b.dataset.t}},3500);return}fn();closeModal()})}
function typeSwitch(type,d){return `<div class="seg seg-type">${[['task','Tasca'],['evt','Esdeveniment'],['sch','Activitat de l\u2019horari']].map(([k,l])=>`<button type="button" class="${k===type?'on':''}" data-switch="${k}">${l}</button>`).join('')}</div>`}
function bindSwitch(md,d){$$('[data-switch]',md).forEach(b=>b.addEventListener('click',()=>{const t=md.querySelector('[name=title]');openCreate(b.dataset.switch,{...d,title:t?t.value:''})}))}
function nextHour(){return Math.min(cfg().dayEnd*60-60,Math.ceil((nowMin()+1)/60)*60)}
function openCreate(type='task',d={}){if(type==='evt')openEvt(null,d,true);else if(type==='sch')openSch(null,d,true);else openTask(null,d,true)}
function openItem(type,id){if(type==='task')openTask(id);else if(type==='evt')openEvt(id);else if(type==='sch')openSch(id)}
function checkTimes(f){const a=toMin(f.start.value),b=toMin(f.end.value);if(a==null||b==null||b<=a){toast('L\u2019hora de final ha de ser posterior a la d\u2019inici.');return false}return true}

/* event */
function openEvt(id,d={},isNew=!id){
  const e=id?S.evt[id]:null;if(id&&!e)return;
  const s=d.start??nextHour();
  const v=e||{title:d.title||'',date:d.date||st.calDate||today(),start:fromMin(s),end:fromMin(d.end??Math.min(s+60,1440)),cat:d.cat||defaultCat(),location:'',notes:'',reminder:null};
  openModal(`${mhead(e?'Esdeveniment':'Nou')}${!e?typeSwitch('evt',d):''}<div class="md-in"><form class="ed">
    <input class="ed-title" name="title" placeholder="Títol de l\u2019esdeveniment" value="${esc(v.title)}" required autocomplete="off" autofocus>
    <div class="row3">${fld('Dia',`<input type="date" name="date" value="${v.date}" required>`)}${fld('Inici',`<input type="time" name="start" step="300" value="${v.start}" required>`)}${fld('Final',`<input type="time" name="end" step="300" value="${v.end}" required>`)}</div>
    ${fld('Categoria',catPicker(v.cat),'full')}
    ${fld('Lloc',`<input name="location" value="${esc(v.location)}" placeholder="Opcional">`)}
    ${fld('Recordatori',remPicker(v.reminder))}
    ${fld('Notes',`<textarea name="notes" rows="3" placeholder="Opcional">${esc(v.notes)}</textarea>`,'full')}
    <div class="ed-foot">${e?`<button type="button" class="btn ghost danger" data-del>${I.trash} Elimina</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-close>Cancel·la</button><button class="btn primary">Desa</button></div>
  </form></div>`,md=>{
    bindRem(md);bindSwitch(md,d);bindDelete(md,()=>{del('evt',id);toast('Esdeveniment eliminat.')});
    md.querySelector('form').addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;if(!checkTimes(f))return;
      put('evt',{...(e?clone(e):{id:uid()}),title:f.title.value.trim()||'Sense títol',date:f.date.value,start:f.start.value,end:f.end.value,cat:(f.cat&&f.cat.value)||defaultCat(),location:f.location.value.trim(),notes:f.notes.value,reminder:readRem(f)});
      closeModal();toast(e?'Canvis desats.':'Esdeveniment creat.')});
  });
}

/* schedule series */
function openSch(id,d={},isNew=!id){
  const s=id?S.sch[id]:null;if(id&&!s)return;
  const st0=d.start??480;
  const v=s||{title:d.title||'',day:d.day??wd(st.calDate||today()),start:fromMin(st0),end:fromMin(d.end??Math.min(st0+90,1440)),cat:d.cat||'estudis',location:'',notes:'',reminder:null,from:'',until:'',exc:{}};
  const excs=Object.entries(v.exc||{}).sort((a,b)=>a[0].localeCompare(b[0]));
  openModal(`${mhead(s?'Activitat de l\u2019horari':'Nova')}${!s?typeSwitch('sch',d):''}<div class="md-in"><form class="ed">
    <input class="ed-title" name="title" placeholder="Classe, feina, entrenament…" value="${esc(v.title)}" required autocomplete="off" autofocus>
    ${fld(s?'Dia de la setmana':'Dies de la setmana (pots triar-ne diversos)',`<div class="dayp">${DAYS_S.map((x,i)=>`<label><input type="checkbox" name="days" value="${i}" ${i===v.day?'checked':''}><span>${x}</span></label>`).join('')}</div>`,'full')}
    ${fld('Inici',`<input type="time" name="start" step="300" value="${v.start}" required>`)}${fld('Final',`<input type="time" name="end" step="300" value="${v.end}" required>`)}
    ${fld('Categoria',catPicker(v.cat),'full')}
    ${fld('Lloc / aula',`<input name="location" value="${esc(v.location)}" placeholder="Opcional">`)}
    ${fld('Recordatori cada setmana',remPicker(v.reminder))}
    ${fld('Vigent des de (opcional)',`<input type="date" name="from" value="${v.from||''}">`)}${fld('Fins a (opcional)',`<input type="date" name="until" value="${v.until||''}">`)}
    ${fld('Notes',`<textarea name="notes" rows="2" placeholder="Professor, grup…">${esc(v.notes)}</textarea>`,'full')}
    ${s?`<div class="note-box">Es repeteix cada ${DAYS[v.day].toLowerCase()}. Els canvis d\u2019aquí s\u2019apliquen a tota la sèrie.${s&&excs.length?' Els dies amb excepcions mantenen el seu canvi.':''}</div>`:''}
    ${excs.length?`<div class="full"><div class="fld"><span>Excepcions</span></div>${excs.map(([dd,x])=>`<div class="rem-row"><span>${fmtShort(dd)} ${pd(dd).getFullYear()}</span><span class="muted">${x.cancel?'Anul·lada':`${x.start||v.start}–${x.end||v.end}`}</span><button type="button" class="btn-s" style="margin-left:auto" data-restore="${s.id}|${dd}">Restaura</button></div>`).join('')}</div>`:''}
    <div class="ed-foot">${s?`<button type="button" class="btn ghost danger" data-del>${I.trash} Elimina la sèrie</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-close>Cancel·la</button><button class="btn primary">Desa</button></div>
  </form></div>`,md=>{
    bindRem(md);bindSwitch(md,d);bindDelete(md,()=>{del('sch',id);toast('Activitat eliminada de l\u2019horari.')});
    md.querySelector('form').addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;if(!checkTimes(f))return;
      const days=$$('[name=days]:checked',f).map(x=>+x.value);if(!days.length){toast('Tria almenys un dia.');return}
      const base={title:f.title.value.trim()||'Sense títol',start:f.start.value,end:f.end.value,cat:(f.cat&&f.cat.value)||'altres',location:f.location.value.trim(),notes:f.notes.value,reminder:readRem(f),from:f.from.value||null,until:f.until.value||null};
      if(s){put('sch',{...clone(s),...base,day:days[0]});days.slice(1).forEach(dd=>put('sch',{id:uid(),...base,day:dd,exc:{}}))}
      else days.forEach(dd=>put('sch',{id:uid(),...base,day:dd,exc:{}}));
      closeModal();toast(s?'Horari actualitzat.':days.length>1?`${days.length} activitats afegides a l\u2019horari.`:'Activitat afegida a l\u2019horari.')});
  });
}
function restoreExc(sid,date){const s=S.sch[sid];if(!s||!s.exc||!s.exc[date])return;const n=clone(s);delete n.exc[date];put('sch',n);toast(`Restaurat el ${fmtShort(date)}.`)}

/* schedule occurrence (from calendar) */
function openOcc(key){
  if(key.startsWith('ext:'))return openExt(key);
  const p=key.split(':');
  if(p[0]==='evt')return openEvt(p[1]);
  if(p[0]==='task')return openTask(p[1]);
  if(p[0]==='tpl')return openSch(p[1]);
  const sid=p[1],date=p[2],s=S.sch[sid];if(!s)return;
  const ex=(s.exc&&s.exc[date])||{};const v={...s,...ex};
  openModal(`${mhead(fmtLong(date))}<div class="md-in"><form class="ed">
    <input class="ed-title" name="title" value="${esc(v.title)}" required autocomplete="off">
    ${fld('Inici',`<input type="time" name="start" step="300" value="${v.start}" required>`)}${fld('Final',`<input type="time" name="end" step="300" value="${v.end}" required>`)}
    ${fld('Categoria',catPicker(v.cat),'full')}
    ${fld('Lloc / aula',`<input name="location" value="${esc(v.location)}">`,'full')}
    ${fld('Notes',`<textarea name="notes" rows="2">${esc(v.notes)}</textarea>`,'full')}
    <div class="full fld"><span>Aplica els canvis a</span><div class="scope">
      <label><input type="radio" name="scope" value="one" checked><span><b>Només aquest dia</b><br><span class="muted">${fmtShort(date)}. La resta de setmanes queden igual.</span></span></label>
      <label><input type="radio" name="scope" value="all"><span><b>Tota la sèrie</b><br><span class="muted">Cada ${DAYS[s.day].toLowerCase()}.</span></span></label></div></div>
    ${ex&&Object.keys(ex).length?`<div class="note-box">Aquest dia té un canvi respecte a l\u2019horari habitual. <button type="button" class="btn-s" data-restore="${sid}|${date}">Restaura l\u2019original</button></div>`:''}
    <div class="ed-foot"><button type="button" class="btn ghost danger" data-cancel-one>Anul·la aquest dia</button><button type="button" class="btn ghost danger" data-del>Elimina la sèrie</button><span class="sp"></span><button class="btn primary">Desa</button></div>
  </form></div>`,md=>{
    bindDelete(md,()=>{del('sch',sid);toast('Activitat eliminada de l\u2019horari.')});
    md.querySelector('[data-cancel-one]').addEventListener('click',()=>{const n=clone(s);n.exc=n.exc||{};n.exc[date]={cancel:true};put('sch',n);closeModal();toast(`Anul·lada només el ${fmtShort(date)}.`,{action:{label:'Desfés',fn:()=>restoreExc(sid,date)}})});
    md.querySelector('form').addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;if(!checkTimes(f))return;
      const vals={title:f.title.value.trim()||s.title,start:f.start.value,end:f.end.value,cat:(f.cat&&f.cat.value)||s.cat,location:f.location.value.trim(),notes:f.notes.value};
      const n=clone(s);
      if(f.scope.value==='one'){n.exc=n.exc||{};const o={};for(const k in vals)if(vals[k]!==(s[k]??''))o[k]=vals[k];if(Object.keys(o).length)n.exc[date]=o;else delete n.exc[date];put('sch',n);toast(`Canvi aplicat només al ${fmtShort(date)}.`)}
      else{Object.assign(n,vals);put('sch',n);toast('Canvi aplicat a tota la sèrie.')}
      closeModal()});
  });
}

/* task */
function openTask(id,d={},isNew=!id){
  const t=id?S.task[id]:null;if(id&&!t)return;
  const v=t?clone(t):{title:d.title||'',desc:'',due:d.due===undefined?today():d.due,time:d.time||'',dur:d.dur||60,prio:d.prio||'med',cat:d.cat||defaultCat(),subs:[],notes:'',reminder:null,rec:null,slot:d.slot||null};
  let subs=clone(v.subs||[]);let slot=v.slot?{...v.slot}:null;
  const durs=[15,30,45,60,90,120,180,240];
  const subsHtml=()=>subs.map(s=>`<div class="sub ${s.done?'done':''}" data-sid="${s.id}"><input type="checkbox" ${s.done?'checked':''} data-subchk aria-label="Fet"><span class="st">${esc(s.t)}</span><button type="button" class="icon-btn" data-subdel aria-label="Elimina la subtasca">${I.x}</button></div>`).join('');
  const slotHtml=()=>slot?`<div class="slot-info">${I.cal}<span>Programada: <b>${fmtRel(slot.date)} ${slot.start}–${slot.end}</b></span><span class="sp"></span><button type="button" class="btn-s" data-unslot>Treu del calendari</button></div>`:'';
  openModal(`${mhead(t?'Tasca':'Nova')}${!t?typeSwitch('task',d):''}<div class="md-in"><form class="ed">
    <input class="ed-title" name="title" placeholder="Què has de fer?" value="${esc(v.title)}" required autocomplete="off" autofocus>
    ${fld('Descripció',`<textarea name="desc" rows="2" placeholder="Opcional">${esc(v.desc)}</textarea>`,'full')}
    <div class="row3">${fld('Data límit',`<input type="date" name="due" value="${v.due||''}">`)}${fld('Hora',`<input type="time" name="time" step="300" value="${v.time||''}">`)}${fld('Durada estimada',`<select name="dur">${durs.map(m=>`<option value="${m}" ${m===(v.dur||60)?'selected':''}>${durTxt(m)}</option>`).join('')}</select>`)}</div>
    ${fld('Prioritat',`<div class="prp">${Object.entries(PRIO).reverse().map(([k,l])=>`<label><input type="radio" name="prio" value="${k}" ${k===v.prio?'checked':''}><span>${l}</span></label>`).join('')}</div>`,'full')}
    ${fld('Categoria',catPicker(v.cat),'full')}
    <div class="full fld"><span>Subtasques</span><div class="subs" id="subs">${subsHtml()}</div><input id="sub-new" placeholder="Afegeix una subtasca i prem Retorn" autocomplete="off"></div>
    ${fld('Recordatori',remPicker(v.reminder))}
    ${fld('Es repeteix',`<select name="rec"><option value="">No</option>${Object.entries(REC).map(([k,l])=>`<option value="${k}" ${v.rec===k?'selected':''}>${l}</option>`).join('')}</select>`)}
    ${fld('Notes',`<textarea name="notes" rows="2" placeholder="Opcional">${esc(v.notes)}</textarea>`,'full')}
    <div class="full" id="slotbox">${slotHtml()}</div>
    <div class="ed-foot">${t?`<button type="button" class="btn ghost danger" data-del>${I.trash} Elimina</button>`:''}${t?`<button type="button" class="btn ghost" data-done>${t.done?'Marca com a pendent':I.tick+' Completada'}</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-close>Cancel·la</button><button class="btn primary">Desa</button></div>
  </form></div>`,md=>{
    bindRem(md);bindSwitch(md,d);bindDelete(md,()=>{del('task',id);toast('Tasca eliminada.')});
    const box=$('#subs',md),inp=$('#sub-new',md);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const x=inp.value.trim();if(!x)return;subs.push({id:uid(),t:x,done:false});inp.value='';box.innerHTML=subsHtml()}});
    box.addEventListener('click',e=>{const r=e.target.closest('.sub');if(!r)return;const s=subs.find(x=>x.id===r.dataset.sid);if(e.target.closest('[data-subdel]')){subs=subs.filter(x=>x!==s);box.innerHTML=subsHtml()}else if(e.target.matches('[data-subchk]')){s.done=e.target.checked;r.classList.toggle('done',s.done)}});
    md.addEventListener('click',e=>{if(e.target.closest('[data-unslot]')){slot=null;$('#slotbox',md).innerHTML=''}});
    const dn=md.querySelector('[data-done]');if(dn)dn.addEventListener('click',()=>{closeModal();toggleTask(id)});
    md.querySelector('form').addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;
      const pendingSub=inp.value.trim();if(pendingSub)subs.push({id:uid(),t:pendingSub,done:false});
      const dur=+f.dur.value||60;
      if(slot){const a=toMin(slot.start);slot.end=fromMin(Math.min(a+dur,1440))}
      const o={...(t?clone(t):{id:uid(),done:false,doneAt:null,created:Date.now()}),title:f.title.value.trim()||'Sense títol',desc:f.desc.value,due:f.due.value||null,time:f.time.value||null,dur,prio:f.prio.value||'med',cat:(f.cat&&f.cat.value)||defaultCat(),subs,notes:f.notes.value,reminder:readRem(f),rec:f.rec.value||null,slot};
      put('task',o);closeModal();toast(t?'Tasca desada.':'Tasca creada.')});
  });
}

/* external event (read-only) */
function openExt(key){

  const when=e.all_day?(e.end_date>e.date?`${fmtLong(e.date)} – ${fmtLong(e.end_date)} · tot el dia`:`${fmtLong(e.date)} · tot el dia`):`${fmtLong(e.date)} · ${fromMin(e.start_min)}–${fromMin(Math.min(e.end_min,1440))}`;
  openModal(`${mhead('Esdeveniment del calendari')}<div class="md-in"><div class="ext-view">

/* calendar feeds (settings) */
function openFeed(id){
  const f=id?FEEDS[id]:null;
  const v=f||{name:'',url:'',cat:'esport',reminder:60};
  const g=f&&f.source==='gcal';

    ${g?`<div class="note-box">Aquest calendari ve del teu Google Calendar. S\u2019actualitza cada matí amb els esdeveniments de les pròximes tres setmanes. Aquí pots canviar-ne el nom, la categoria i l\u2019avís, o amagar-lo.</div>`:fld('Enllaç del calendari (.ics)',`<input type="url" name="url" value="${esc(v.url||'')}" placeholder="https://calendar.google.com/calendar/ical/…/basic.ics" required autocomplete="off" inputmode="url">`,'full')}
    ${f?'':`<div class="note-box"><b>Google Calendar:</b> a l\u2019ordinador, obre calendar.google.com › Configuració (roda dentada) › tria el calendari a l\u2019esquerra › «Integra el calendari» › copia l\u2019<b>Adreça secreta en format iCal</b>.<br><b>Calendari compartit:</b> enganxa l\u2019enllaç .ics o webcal:// que et donin.</div>`}
    ${fld('Categoria a l\u2019agenda',catPicker(v.cat),'full')}
    ${fld('Avís per defecte',remPicker(v.reminder))}

/* search */
function openSearch(){
  openModal(`<div class="srch">${I.search}<input id="q" placeholder="Cerca tasques, esdeveniments i horari" autocomplete="off" autofocus><button class="icon-btn" data-close aria-label="Tanca">${I.x}</button></div><div class="srch-res" id="sres"></div>`,md=>{
    const q=$('#q',md),res=$('#sres',md);let sel=0,list=[];
    const run=()=>{const s=norm(q.value.trim());list=[];
      if(s){
        tasksAll().forEach(t=>{if(norm(t.title+' '+t.desc+' '+t.notes+' '+(t.subs||[]).map(x=>x.t).join(' ')).includes(s))list.push({k:t.done?'Tasca feta':'Tasca',t:t.title,w:t.due?fmtRel(t.due):'',c:t.cat,go:()=>openTask(t.id),r:t.done?2:0})});
        Object.values(S.evt).forEach(e=>{if(norm(e.title+' '+e.notes+' '+e.location).includes(s))list.push({k:'Esdeveniment',t:e.title,w:`${fmtShort(e.date)} ${e.start}`,c:e.cat,go:()=>openEvt(e.id),r:1})});
        Object.values(S.sch).forEach(x=>{if(norm(x.title+' '+x.notes+' '+x.location).includes(s))list.push({k:'Horari',t:x.title,w:`${DAYS[x.day]} ${x.start}`,c:x.cat,go:()=>openSch(x.id),r:1})});
        EXT.forEach(x=>{if(extOk(x)&&norm(x.title+' '+x.notes+' '+x.location).includes(s))list.push({k:(feedOf(x).name||'Calendari').slice(0,14),t:x.title,w:`${fmtShort(x.date)}${x.all_day?'':' '+fromMin(x.start_min)}`,c:feedOf(x).cat,go:()=>openExt(extKey(x)),r:x.date<today()?2:1})});
        list.sort((a,b)=>a.r-b.r);list=list.slice(0,40);
      }
      sel=0;res.innerHTML=list.map((x,i)=>`<div class="sr ${i===sel?'on':''}" data-i="${i}"><span class="k">${x.k}</span><i class="dot" style="--c:${cat(x.c).color}"></i><span class="t">${esc(x.t)}</span><span class="w">${esc(x.w)}</span></div>`).join('')||(s?'<div class="empty" style="padding:12px">Sense resultats.</div>':'<div class="empty" style="padding:12px">Escriu per cercar. Drecera: Ctrl K</div>');
    };
    q.addEventListener('input',run);run();
    q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(list.length-1,sel+(e.key==='ArrowDown'?1:-1)));$$('.sr',res).forEach((n,i)=>n.classList.toggle('on',i===sel))}if(e.key==='Enter'&&list[sel]){list[sel].go()}});
    res.addEventListener('click',e=>{const r=e.target.closest('.sr');if(r)list[+r.dataset.i].go()});
  });
}

/* ================= drag & drop (pointer) ================= */
let drag=null,suppressClick=false;
function colAt(x,y){for(const n of document.elementsFromPoint(x,y)){const c=n.closest&&n.closest('.tg-col');if(c)return c}return null}
function minAt(col,y){const c=cfg(),r=col.getBoundingClientRect();return c.dayStart*60+(y-r.top)/hh()*60}
document.addEventListener('pointerdown',e=>{
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(err){}}
  if(e.button!==0||drag)return;
  if(e.target.closest('button,input,select,textarea,a'))return;
  const ev=e.target.closest('.tg-col .ev:not([data-type=ext])'),tk=e.target.closest('[data-dragtask]');
  if(e.target.closest('.ev[data-type=ext]'))return;
  if(ev){
    const resize=!!e.target.closest('[data-resize]');
    drag={kind:resize?'resize':'move',el:ev,x0:e.clientX,y0:e.clientY,touch:e.pointerType==='touch',armed:e.pointerType!=='touch',active:false,
      o:{key:ev.dataset.key,type:ev.dataset.type,id:ev.dataset.id,date:ev.dataset.date,start:+ev.dataset.start,end:+ev.dataset.end,title:ev.title},mode:ev.closest('.tg-col').dataset.mode};
    drag.grab=minAt(ev.closest('.tg-col'),e.clientY)-drag.o.start;
  }else if(tk){
    const t=S.task[tk.dataset.dragtask];if(!t)return;
    drag={kind:'task',el:tk,x0:e.clientX,y0:e.clientY,touch:e.pointerType==='touch',armed:e.pointerType!=='touch',active:false,t};
  }else return;
  if(drag.touch)drag.timer=setTimeout(()=>{if(drag){drag.armed=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(err){}activate()}},280);
});
function activate(){
  if(!drag||drag.active)return;drag.active=true;document.body.classList.add('is-dragging');
  if(drag.kind==='task'){const g=document.createElement('div');g.className='drag-ghost';g.textContent=drag.t.title;document.body.appendChild(g);drag.ghost=g;g.style.left=drag.x0+'px';g.style.top=drag.y0+'px'}
  else drag.el.classList.add('dragging');
}
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0,dist=Math.hypot(dx,dy);
  if(!drag.active){
    if(drag.touch&&!drag.armed){if(dist>8){clearTimeout(drag.timer);drag=null}return}
    if(dist<5)return;activate();
  }
  e.preventDefault();
  const c=cfg(),s0=c.dayStart*60,s1=c.dayEnd*60,H=hh();
  if(drag.kind==='task'){
    drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
    const col=colAt(e.clientX,e.clientY);
    $$('.tg-col.drop-on').forEach(n=>n!==col&&n.classList.remove('drop-on'));
    if(drag.prev&&(!col||drag.prev.parentNode!==col)){drag.prev.remove();drag.prev=null}
    if(col&&col.dataset.mode!=='sch'){
      col.classList.add('drop-on');
      const dur=drag.t.dur||60;let m=snap15(minAt(col,e.clientY)-15);m=Math.max(s0,Math.min(s1-dur,m));
      if(!drag.prev){drag.prev=document.createElement('div');drag.prev.className='ev preview';col.appendChild(drag.prev)}
      drag.prev.style.cssText=`top:${(m-s0)/60*H+1}px;height:${dur/60*H-2}px;left:2px;width:calc(100% - 4px)`;
      drag.prev.textContent=`${fromMin(m)}–${fromMin(m+dur)}`;
      drag.target={date:col.dataset.date,start:m};
    }else drag.target=null;
    return;
  }
  const o=drag.o,dur=o.end-o.start;
  if(drag.kind==='move'){
    const col=colAt(e.clientX,e.clientY)||drag.el.parentNode;
    if(col.dataset.mode!==drag.mode)return;
    let m=snap15(minAt(col,e.clientY)-drag.grab);m=Math.max(s0,Math.min(s1-dur,m));
    if(drag.el.parentNode!==col)col.appendChild(drag.el);
    drag.el.style.top=((m-s0)/60*H+1)+'px';drag.el.style.left='2px';drag.el.style.width='calc(100% - 4px)';
    const mt=drag.el.querySelector('.ev-m');if(mt)mt.textContent=`${fromMin(m)}–${fromMin(m+dur)}`;
    drag.target={date:col.dataset.date,start:m,end:m+dur};
  }else{
    const col=drag.el.parentNode;let m=snap15(minAt(col,e.clientY));m=Math.max(o.start+15,Math.min(s1,m));
    drag.el.style.height=((m-o.start)/60*H-2)+'px';
    const mt=drag.el.querySelector('.ev-m');if(mt)mt.textContent=`${fromMin(o.start)}–${fromMin(m)}`;
    drag.target={date:o.date,start:o.start,end:m};
  }
},{passive:false});
document.addEventListener('touchmove',e=>{if(drag&&drag.active)e.preventDefault()},{passive:false});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;clearTimeout(d.timer);
  document.body.classList.remove('is-dragging');
  if(d.ghost)d.ghost.remove();if(d.prev)d.prev.remove();$$('.tg-col.drop-on').forEach(n=>n.classList.remove('drop-on'));
  if(!d.active){if(!cancel&&d.kind!=='task'&&e&&e.type==='pointerup'){suppressClick=true;setTimeout(()=>suppressClick=false,50);openOcc(d.o.key)}if(d.needRender)render();return}
  suppressClick=true;setTimeout(()=>suppressClick=false,50);
  if(cancel||!d.target){render();return}
  commitDrag(d);render();
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
function commitDrag(d){
  const tg=d.target;
  if(d.kind==='task'){
    const t=S.task[d.t.id];if(!t)return;const dur=t.dur||60;
    const s=findFit(tg.date,tg.start,dur,'task:'+t.id);
    if(s==null){toast(`No hi ha cap espai lliure de ${durTxt(dur)} aquest dia.`);return}
    put('task',{...clone(t),slot:{date:tg.date,start:fromMin(s),end:fromMin(s+dur)}});
    toast(s!==tg.start?`Col·locada a les ${fromMin(s)}, el primer espai lliure.`:`Programada ${fmtRel(tg.date).toLowerCase()} a les ${fromMin(s)}.`);
    return;
  }
  const o=d.o;if(tg.date===o.date&&tg.start===o.start&&tg.end===o.end)return;
  if(o.type==='evt'){const e=S.evt[o.id];if(e)put('evt',{...clone(e),date:tg.date,start:fromMin(tg.start),end:fromMin(tg.end)})}
  else if(o.type==='task'){
    const t=S.task[o.id];if(!t)return;const dur=tg.end-tg.start;
    const s=findFit(tg.date,tg.start,dur,o.key);
    if(s==null){toast('No hi cap en aquest espai: se superposaria amb una altra activitat.');return}
    put('task',{...clone(t),dur,slot:{date:tg.date,start:fromMin(s),end:fromMin(s+dur)}});
    if(s!==tg.start)toast(`Ajustada a les ${fromMin(s)} per no superposar-se.`);
  }else if(o.type==='sch'){
    if(d.mode==='sch'){const s=S.sch[o.id];if(s)put('sch',{...clone(s),day:wd(tg.date),start:fromMin(tg.start),end:fromMin(tg.end)})}
    else askScope(o,tg);
  }
}

/* ================= touch swipes (mobile) ================= */
let sw=null;
document.addEventListener('touchstart',e=>{
  sw=null;if(!isMobile()||e.touches.length!==1||MR().classList.contains('open'))return;
  if(e.target.closest('button,input,select,textarea,a'))return;
  const t=e.touches[0],row=e.target.closest('.tswipe .trow'),cal=e.target.closest('[data-swipe=cal]');
  if(row&&!row.classList.contains('is-done'))sw={kind:'task',row,wrap:row.parentNode,x0:t.clientX,y0:t.clientY,dx:0,on:false};
  else if(cal)sw={kind:'cal',x0:t.clientX,y0:t.clientY,dx:0,on:false};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!sw)return;if(drag&&drag.active){sw=null;return}
  const t=e.touches[0],dx=t.clientX-sw.x0,dy=t.clientY-sw.y0;
  if(!sw.on){
    if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){sw=null;return}
    if(Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)*(sw.kind==='cal'?2:1.3)){sw.on=true;if(drag){clearTimeout(drag.timer);drag=null}}else return;
  }
  sw.dx=dx;
  if(sw.kind==='task'){e.preventDefault();sw.row.style.transition='none';sw.row.style.transform=`translateX(${dx}px)`;
    sw.wrap.classList.toggle('sw-r',dx>0);sw.wrap.classList.toggle('sw-l',dx<0);sw.wrap.classList.toggle('sw-go',Math.abs(dx)>90)}
},{passive:false});
document.addEventListener('touchend',()=>{
  if(!sw)return;const s=sw;sw=null;if(!s.on)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,80);
  if(s.kind==='cal'){if(Math.abs(s.dx)>90){const n=s.dx<0?1:-1;if(st.calView==='month'){const d=pd(st.calDate);st.calDate=ds(new Date(d.getFullYear(),d.getMonth()+n,1))}else st.calDate=addDays(st.calDate,n*(st.calView==='week'?7:st.calView==='3day'?3:1));render()}return}
  const id=s.row.dataset.openTask;
  s.row.style.transition='transform .18s ease-out';
  if(Math.abs(s.dx)>90){s.row.style.transform=`translateX(${s.dx>0?'110%':'-110%'})`;setTimeout(()=>{if(s.dx>0){toggleTask(id);toast('Tasca completada.',{action:{label:'Desfés',fn:()=>{const t=S.task[id];if(t&&t.done)put('task',{...clone(t),done:false,doneAt:null})}}})}else postpone(id)},170)}
  else{s.row.style.transform='';setTimeout(()=>s.wrap.classList.remove('sw-r','sw-l','sw-go'),180)}
});
function postpone(id){const t=S.task[id];if(!t)return;const prev=clone(t);put('task',{...clone(t),due:addDays(today(),1),slot:null});toast('Passada a demà.',{action:{label:'Desfés',fn:()=>put('task',{...prev})}})}

/* ================= toasts ================= */
function toast(msg,{cls='',sticky=false,html=false,action=null}={}){
  const el=document.createElement('div');el.className='toast '+cls;
  el.innerHTML=`<div class="tb">${html?msg:esc(msg)}</div>${action?`<button data-ta>${esc(action.label)}</button>`:''}<button data-tx aria-label="Tanca">${I.x}</button>`;
  el.querySelector('[data-tx]').onclick=()=>el.remove();
  if(action)el.querySelector('[data-ta]').onclick=()=>{el.remove();action.fn()};
  $('#toasts').appendChild(el);
  const all=$$('#toasts .toast');if(all.length>4)all[0].remove();
  if(!sticky)setTimeout(()=>el.remove(),4200);
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  if(suppressClick){e.preventDefault();e.stopPropagation();return}

    const calStep=n=>{const v=st.calView;if(v==='month'){const d=pd(st.calDate);st.calDate=ds(new Date(d.getFullYear(),d.getMonth()+n,1))}else st.calDate=addDays(st.calDate,n*(v==='week'?7:v==='3day'?3:1));render()};

      case 'search':openSearch();break;
      case 'cal-prev':calStep(-1);break;case 'cal-next':calStep(1);break;
      case 'cal-today':st.calDate=today();st.scroll={};render();break;
      case 'toggle-sch':st.showSch=!st.showSch;render();break;
      case 'toggle-free':st.showFree=!st.showFree;saveUi();render();break;
      case 'new-sch':openCreate('sch',{});break;
      case 'plan-prev':st.planDate=addDays(st.planDate,-1);render();break;
      case 'plan-next':st.planDate=addDays(st.planDate,1);render();break;
      case 'plan-today':st.planDate=today();render();break;
      case 'auto-plan':{const d=st.planDate;const list=sortTasks(tasksAll().filter(x=>!x.done&&!x.slot&&(x.prio==='urgent'||x.prio==='high'||isOverdue(x)||x.due===d)));let n=0;list.forEach(x=>{if(autoPlace(x.id,d,true))n++});toast(n?`${n} ${n===1?'tasca col·locada':'tasques col·locades'} als espais lliures.`:list.length?'No hi ha prou espai lliure per a les prioritàries.':'No hi ha tasques prioritàries per col·locar.');break}
      case 'stats-prev':st.statsWeek=addDays(st.statsWeek,-7);render();break;
      case 'stats-next':st.statsWeek=addDays(st.statsWeek,7);render();break;
      case 'stats-now':st.statsWeek=weekStart(today());render();break;
      case 'goto-done':st.taskTab='fetes';break;
      case 'notif-on':enableNotif();break;
      case 'notif-test':testPush();break;
      case 'logout':logout();break;
      case 'feed-add':openFeed(null);break;
      case 'toggle-filters':st.showFilters=!st.showFilters;render();break;
      case 'cal-prev-w':st.calDate=addDays(st.calDate,-7);render();break;
      case 'cal-next-w':st.calDate=addDays(st.calDate,7);render();break;
      case 'ics':exportIcs();break;
      case 'cat-add':{const n=catsSorted().length;put('cat',{id:uid(),name:'Nova categoria',color:['#3f7fc4','#c08431','#8a6bc9','#2f9a6b','#cf5f4c','#33a0a8','#b0568f','#6b8e23'][n%8],order:n});break}
    }
    return;
  }
  const tg=t.closest('[data-toggle-task]');if(tg){toggleTask(tg.dataset.toggleTask);return}
  const pl=t.closest('[data-place]');if(pl){autoPlace(pl.dataset.place,st.route==='planificar'?st.planDate:today());return}
  const ot=t.closest('[data-open-task]');if(ot){openTask(ot.dataset.openTask);return}
  const exv=t.closest('.ev[data-type=ext]');if(exv){openExt(exv.dataset.key);return}
  const fe=t.closest('[data-feed-edit]');if(fe){openFeed(fe.dataset.feedEdit);return}
  const fs=t.closest('[data-feed-sync]');if(fs){syncFeedNow(fs.dataset.feedSync);return}
  const oo=t.closest('[data-open-occ]');if(oo){e.stopPropagation();openOcc(oo.dataset.openOcc);return}
  const cv=t.closest('[data-calview]');if(cv){st.calView=cv.dataset.calview;saveUi();render();return}
  const gd=t.closest('[data-goto-day]');if(gd){st.calDate=gd.dataset.gotoDay;if(st.calView==='month'||st.route!=='calendari')st.calView='day';if(st.route!=='calendari')go('calendari');else render();return}
  const gt=t.closest('[data-goto]');if(gt&&st.route==='calendari'){st.calDate=gt.dataset.goto;st.calView='day';saveUi();render();return}
  const tc=t.closest('[data-togglecat]');if(tc){const id=tc.dataset.togglecat;st.hiddenCats.has(id)?st.hiddenCats.delete(id):st.hiddenCats.add(id);render();return}
  const tt=t.closest('[data-tasktab]');if(tt){st.taskTab=tt.dataset.tasktab;render();return}
  const fc=t.closest('[data-fcat]');if(fc){st.fCat=fc.dataset.fcat;render();return}
  const cd=t.closest('[data-catdel]');if(cd){const id=cd.dataset.catdel;if(id==='altres')return;
    if(!cd.classList.contains('armed')){cd.classList.add('armed');cd.style.color='var(--danger)';toast('Torna a clicar la paperera per confirmar.');setTimeout(()=>{cd.classList.remove('armed');cd.style.color=''},3500);return}
    ['sch','evt','task'].forEach(k=>Object.values(S[k]).forEach(x=>{if(x.cat===id)put(k,{...clone(x),cat:'altres'})}));
    if(!S.cat.altres)put('cat',{id:'altres',name:'Altres',color:'#7d8189',order:99});
    del('cat',id);return}
  // click on empty grid slot / free slot
  const col=t.closest('.tg-col');
  if(col&&!t.closest('.ev')){
    const m=Math.max(cfg().dayStart*60,Math.floor(minAt(col,e.clientY)/30)*30);const date=col.dataset.date,mode=col.dataset.mode;
    const fr=t.closest('.free');
    if(mode==='sch')openCreate('sch',{day:wd(date),start:m,end:m+60});
    else if(mode==='plan'){let a=m,b=m+60;if(fr){const [x,y]=fr.dataset.free.split('-').map(Number);a=Math.max(x,m);b=Math.min(y,a+60);if(b-a<15){a=x;b=Math.min(y,x+60)}}openCreate('task',{due:date,slot:{date,start:fromMin(a),end:fromMin(b)},dur:b-a})}
    else openCreate('evt',{date,start:m,end:Math.min(m+60,1440)});
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-fprio]')){st.fPrio=t.value;render()}
  else if(t.matches('[data-catname]')){const c=S.cat[t.dataset.catname];if(c&&t.value.trim())put('cat',{...clone(c),name:t.value.trim()})}
  else if(t.matches('[data-catcolor]')){const c=S.cat[t.dataset.catcolor];if(c)put('cat',{...clone(c),color:t.value})}
  else if(t.id==='set-name'){put('cfg',{...cfg(),id:'main',name:t.value.trim()})}
  else if(t.id==='set-ds'||t.id==='set-de'){let a=+$('#set-ds').value,b=+$('#set-de').value;if(b-a<4){toast('La franja ha de tenir almenys 4 hores.');render();return}put('cfg',{...cfg(),id:'main',dayStart:a,dayEnd:b});st.scroll={}}
});
document.addEventListener('keydown',e=>{
  const q=e.target.closest&&e.target.closest('[data-quick]');
  if(q&&e.key==='Enter'){e.preventDefault();const p=parseQuick(q.value);if(!p.title)return;
    const mode=q.dataset.quick;const due=mode==='today'?today():mode==='tomorrow'?addDays(today(),1):null;
    newTask({title:p.title,prio:p.prio,cat:p.catId||defaultCat(),due});q.value='';pendingRender=false;render();
    const again=$(`[data-quick="${mode}"]`);if(again)again.focus();toast('Tasca afegida.');return}
  if(e.key==='Escape'&&MR().classList.contains('open')){closeModal();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable;
  if(typing||MR().classList.contains('open')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='n'){e.preventDefault();$('.side-create').click()}
  else if(e.key==='/'){e.preventDefault();openSearch()}
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender){const a=document.activeElement;if(!(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.value))render()}},0)});
window.addEventListener('hashchange',()=>{readHash();render();$('#view').scrollTop=0});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickReminders();scheduleRender()}});

/* ================= auth ================= */
const AUTH_ERR=m=>/invalid login/i.test(m)?'Correu o contrasenya incorrectes.':/not confirmed/i.test(m)?'Encara has de confirmar el compte des del correu que t’hem enviat.':/already registered|already exists/i.test(m)?'Ja hi ha un compte amb aquest correu. Entra-hi.':/at least 6|password should/i.test(m)?'La contrasenya ha de tenir almenys 6 caràcters.':/rate limit|security purposes/i.test(m)?'Massa intents seguits. Espera uns minuts i torna-ho a provar.':/fetch|network/i.test(m)?'No hi ha connexió. Torna-ho a provar.':m;
function showAuth(mode='login',msg='',ok=false){
  const el=$('#auth');el.classList.remove('hide');
  const T={login:['Entra a la teva agenda','Entra'],signup:['Crea el teu compte','Crea el compte'],forgot:['Recupera la contrasenya','Envia l’enllaç'],newpass:['Tria una contrasenya nova','Desa la contrasenya']}[mode];
  el.innerHTML=`<form class="auth-card" id="auth-f" novalidate>
    <div class="brand"><div class="brand-mark">A</div><b>Agenda</b></div>
    <h1>${T[0]}</h1>
    ${mode!=='newpass'?`<label class="fld"><span>Correu electrònic</span><input type="email" id="a-email" autocomplete="email" required></label>`:''}
    ${mode!=='forgot'?`<label class="fld"><span>${mode==='newpass'?'Contrasenya nova':'Contrasenya'}</span><input type="password" id="a-pass" autocomplete="${mode==='login'?'current-password':'new-password'}" minlength="6" required></label>`:''}
    <p class="auth-msg ${ok?'ok':''}" id="a-msg" role="status">${esc(msg)}</p>
    <button class="btn primary" id="a-go">${T[1]}</button>
    <div class="auth-links">${mode==='login'?`<button type="button" data-am="signup">Encara no tens compte? Crea’l</button><button type="button" data-am="forgot">He oblidat la contrasenya</button>`:mode==='newpass'?'':`<button type="button" data-am="login">Ja tinc compte · Entra</button>`}</div>
  </form>`;
  $$('[data-am]',el).forEach(b=>b.onclick=()=>showAuth(b.dataset.am));
  const f=$('#auth-f'),m=$('#a-msg'),go=$('#a-go');
  const first=f.querySelector('input');if(first)first.focus();
  f.onsubmit=async e=>{e.preventDefault();m.className='auth-msg';m.textContent='';
    const email=($('#a-email')||{}).value?.trim(),pass=($('#a-pass')||{}).value||'';
    if(mode!=='newpass'&&!/^\S+@\S+\.\S+$/.test(email||'')){m.textContent='Escriu un correu vàlid.';return}
    if(mode!=='forgot'&&pass.length<6){m.textContent='La contrasenya ha de tenir almenys 6 caràcters.';return}
    go.disabled=true;go.textContent='Un moment…';
    try{
      const redirect=location.origin+location.pathname;
      if(mode==='login'){const {error}=await SB.auth.signInWithPassword({email,password:pass});if(error)throw error}
      else if(mode==='signup'){const {data,error}=await SB.auth.signUp({email,password:pass,options:{emailRedirectTo:redirect}});if(error)throw error;
        if(!data.session){showAuth('login','T’hem enviat un correu per confirmar el compte. Obre l’enllaç i després entra aquí amb el teu correu i contrasenya.',true);return}}
      else if(mode==='forgot'){const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(error)throw error;showAuth('login','Si el correu té compte, t’arribarà un enllaç per canviar la contrasenya.',true);return}
      else if(mode==='newpass'){const {error}=await SB.auth.updateUser({password:pass});if(error)throw error;$('#auth').classList.add('hide');toast('Contrasenya canviada.');return}
    }catch(err){m.textContent=AUTH_ERR(String(err&&err.message||err));go.disabled=false;go.textContent=T[1]}
  };
}
async function startSession(user){
  if(USER&&USER.id===user.id)return;
  USER=user;LS='agenda-v1-'+user.id;
  for(const k of KINDS)S[k]={};pending={};meta={lastSync:''};synced=false;
  loadLocal();loadExtLocal();$('#auth').classList.add('hide');
  syncState=navigator.onLine?'connecting':'slow';render();renderSync();
  await pull();pullExt();subscribeLive();flushSoon();checkPush().then(()=>{if(st.route==='ajustos')render()});
}
async function logout(){
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await SB.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){}
  try{localStorage.removeItem(LS)}catch(e){}
  await SB.auth.signOut();location.replace(location.pathname);
}

/* ================= init ================= */
readHash();buildChrome();render();renderSync();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.hash){location.hash=e.data.hash}})}
(async()=>{
  if(!window.supabase){$('#auth').classList.remove('hide');$('#auth').innerHTML='<div class="auth-card"><h1>No s’ha pogut carregar</h1><p class="muted">Comprova la connexió i torna a obrir l’app.</p></div>';return}
  SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){showAuth('newpass');return}
    if(session&&session.user)setTimeout(()=>startSession(session.user),0);
  });
  const {data}=await SB.auth.getSession();
  if(data&&data.session)startSession(data.session.user);
  else if(!location.hash.includes('access_token'))showAuth('login');
})();
window.addEventListener('online',()=>{syncState='connecting';renderSync();pull();flushSoon()});
window.addEventListener('offline',()=>{syncState='slow';renderSync()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&USER){pull();pullExt();flushSoon()}});
setInterval(tickReminders,15000);setTimeout(tickReminders,2500);
setInterval(()=>{if(!MR().classList.contains('open'))scheduleRender()},60000);
</script>
